site_name: Документация
site_url: https://serjnsk.github.io/trenergram/docs/
repo_url: https://github.com/serjnsk/trenergram
docs_dir: docs

theme:
  name: material
  custom_dir: overrides      # wordmark в шапке и шрифт Montserrat
  language: ru
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Светлая тема без переключателя — как в lovix-docs (DOCS_RULES, п. 1.1:
  # «белая, чистая», без тёмных секций).
  palette:
    scheme: default
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections      # группы в левом меню заголовками, как .sn-grp
    - navigation.top
    - navigation.footer        # карточки «Назад / Далее» внизу
    - toc.follow               # активный пункт TOC подсвечивается при скролле
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - stylesheets/docs.css

nav:
  - Главная: index.md
  - Обзор продукта: 01-product-overview.md
  - Функциональные требования: 02-functional-requirements.md
  - Технологический стек: 03-tech-stack.md
  - MVP: 04-mvp.md
  - Этап 2. Монетизация и масштаб: 05-stage-2.md
  - Этап 3. Рост и экосистема: 06-stage-3.md
  - Конкуренты: 07-competitors.md
  - Открытые вопросы: 08-open-questions.md
  - Прототип ↗: https://serjnsk.github.io/trenergram/prototype/

markdown_extensions:
  - tables
  - admonition
  - attr_list
