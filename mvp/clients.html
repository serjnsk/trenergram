<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Клиенты · Тренерграм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base-trainer.css">
<link rel="stylesheet" href="assets/theme-01-strava.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page">
      <!-- Без боковой панели: клик по строке открывает карточку клиента -->
      <div class="cons one">
        <main><section class="pane" id="page"></section></main>
      </div>
    </div>
  </div>
</div>
<div class="ov" id="ov"></div>
<script src="assets/exdb.js"></script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/ui.js"></script>
<script>
/* ═══════════ КЛИЕНТЫ — рабочий список тренера ═══════════
   Таблица во всю ширину, справа — карточка выбранного клиента: программа,
   докуда составлено, активность, максимумы, переходы в конструктор и календарь. */
const CS = {k:null, dir:1};
const V = {q:'', f:'all'};
const unreadOf = c => c.comments.filter((cm,i)=>!cm.reply && !STATE.replied[c.id+':'+i]).length;
const needsAttention = c => unreadOf(c)>0 || (c.prog && c.last && daysBetween(c.last,TODAY)>=3);
const runway = c => { if(!c.prog) return null; const n = composedDays(c.prog); return daysBetween(TODAY, dayDate(c.prog, Math.max(0, n-1))) };
const runwayChip = c => { const r = runway(c);
  if(r === null) return '<span class="chip ghost">без программы</span>';
  if(r < 0) return '<span class="chip rm">кончилась</span>';
  if(r === 0) return '<span class="chip warn">сегодня</span>';
  return `<span class="chip ${r<=7?'warn':'ghost'}">${r} ${plural(r,'день','дня','дней')}</span>`; };

/* Оплата: статус по дате «оплачено до» — просрочена, заканчивается (неделя и
   меньше), оплачено; даты нет — не внесена. Год пишем, только если не текущий. */
const payState = c => { if(!c.paidUntil) return 'none'; const r = daysBetween(TODAY, c.paidUntil); return r < 0 ? 'late' : r <= 7 ? 'soon' : 'ok' };
const payCell = c => { const d = c.paidUntil, st = payState(c), r = d ? daysBetween(TODAY, d) : 0;
  const [cls, t] = {none:['ghost','не внесена'], late:['rm','просрочена'], soon:['warn', r === 0 ? 'последний день' : 'ещё ' + r + ' ' + plural(r,'день','дня','дней')], ok:['ok','оплачено']}[st];
  const date = d ? dm(d) + (d.slice(0,4) !== TODAY.slice(0,4) ? '.' + d.slice(0,4) : '') : '';
  return `<div class="paycell"><span class="chip ${cls}">${t}</span>${d ? `<span class="pd">${st === 'late' ? 'истекла' : 'до'} ${date}</span>` : ''}</div>` };

/* Группы клиента — чипами-ссылками. Личный контейнер участника («Тренировки»)
   не называем: его тренировки и есть тренировки группы. */
const grpChips = c => { const g = groupOf(c.id); return g ? `<span class="gchips"><a class="gchip" href="groups.html?id=${g.id}" title="Группа «${esc(g.n)}» — открыть">${GRPICON}${esc(g.n)}</a></span>` : '' };
const progLabel = c => { const p = program(c.prog), g = groupOf(c.id); return [p && !(p.personal && g) ? p.title : '', g ? g.n : ''].filter(Boolean).join(' · ') };
function match(c){
  if(V.f==='noprog' && c.prog) return false;
  if(V.f==='grp' && !groupOf(c.id)) return false;
  if(V.f==='attn' && !needsAttention(c)) return false;
  if(V.q && norm(c.n).indexOf(norm(V.q))<0) return false;
  return true;
}
function render(){
  let list = CLIENTS.filter(match);
  const SORTS = {
    n:    (a,b)=>a.n.localeCompare(b.n),
    prog: (a,b)=>progLabel(a).localeCompare(progLabel(b)),
    run:  (a,b)=>(runway(a) ?? 9999)-(runway(b) ?? 9999),
    done: (a,b)=>(a.done/a.plan||0)-(b.done/b.plan||0),
    last: (a,b)=>String(a.last||'').localeCompare(String(b.last||'')),
    pay:  (a,b)=>String(a.paidUntil||'9999').localeCompare(String(b.paidUntil||'9999')),
  };
  if(CS.k && SORTS[CS.k]) list = [...list].sort((a,b)=>SORTS[CS.k](a,b)*CS.dir);
  const FILTERS = [['all','Все'],['noprog','Без программы'],['grp','В группах'],['attn','Требуют внимания']];
  const th = (k, n) => `<th class="${k?'srt ':''}${CS.k===k?(CS.dir>0?'up':'dn'):''}" ${k?`data-sort="${k}"`:''}>${n}</th>`;

  $('#page').innerHTML = paneHead('Клиенты', CLIENTS.length, `
      <label class="search" style="width:260px">${ICON.search}<input id="q" placeholder="Поиск по имени…" value="${esc(V.q)}"></label>
      <div class="filters">${FILTERS.map(([k,n])=>`<button data-f="${k}" class="${V.f===k?'on':''}">${esc(n)}</button>`).join('')}</div>`)
    + (list.length ? `<div class="tblwrap"><table class="tbl" data-tbl="cli"><thead><tr>
        ${th('n','Клиент')}${th('prog','Программа')}${th('run','Составлено на')}${th('pay','Оплата')}${th('done','Прогресс')}${th('last','Последняя активность')}${th(null,'Динамика приседа')}
      </tr></thead><tbody>
        ${list.map(c=>{
          const u = unreadOf(c), pr = program(c.prog);
          const idle = c.last && daysBetween(c.last,TODAY)>=3;
          const sq = c.hist && c.hist.squat;
          return `<tr class="click" data-row="${c.id}">
            <td><div class="cellname">
              <span class="av m">${esc(c.ini)}</span>
              <div>
                <div class="n">${esc(c.n)}${u?` <span class="chip acc">${u}</span>`:''}${isOver(c.id)?' <span class="chip over" title="Пока не изменён лимит тарифа, составлять тренировки нельзя">сверх лимита</span>':''}</div>
                <div class="s">${age(c.born)} лет · ${esc(c.sport)} · ${esc(c.level)}</div>
              </div>
            </div></td>
            <td>${pr && !(pr.personal && groupOf(c.id)) ? `<div>${esc(pr.title)}</div>` : ''}${grpChips(c)}${!pr && !groupOf(c.id) ? `<span style="color:var(--tx3)">без программы</span>` : ''}</td>
            <td>${runwayChip(c)}</td>
            <td>${payCell(c)}</td>
            <td>${c.plan?`<div style="display:flex;align-items:center;gap:8px"><div class="bar" style="width:64px"><i style="width:${Math.round(c.done/c.plan*100)}%"></i></div><span style="font-size:13.5px;color:var(--tx3)">${c.done}/${c.plan}</span></div>`:'<span style="color:var(--tx3)">—</span>'}</td>
            <td>${c.last?`<span class="chip ${idle?'warn':'ok'}">${ago(c.last)}</span>`:`<span class="chip ghost">не заходил</span>`}</td>
            <td>${sq?`<div style="display:flex;align-items:center;gap:9px">${sparkline(sq.map(h=>h[1]),56,20)}<span style="font-size:14px;font-weight:600">${fmtNum(c.pm.squat)} кг</span></div>`:'<span style="color:var(--tx3)">—</span>'}</td>
          </tr>`;
        }).join('')}
      </tbody></table></div>` : `<div class="empty"><div class="t">Никого не нашли</div><div class="d">Измените поиск или фильтр</div></div>`);

  $$('[data-tbl="cli"] th[data-sort]').forEach(th=>th.onclick=()=>{
    if(CS.k === th.dataset.sort) CS.dir = -CS.dir; else { CS.k = th.dataset.sort; CS.dir = 1 }
    render();
  });
  /* Строка — ссылка на карточку клиента; ссылки внутри строки (группа) работают сами */
  $$('tr[data-row]').forEach(r=>r.onclick=e=>{ if(e.target.closest('a')) return; location.href='client.html?id='+r.dataset.row });
  $$('.filters button').forEach(b=>b.onclick=()=>{ V.f=b.dataset.f; render() });
  $('#q').oninput=e=>{ V.q=e.target.value; render() };
  $('#q').focus({preventScroll:true}); $('#q').setSelectionRange(V.q.length,V.q.length);
}
render();
initShell({page:'clients.html'});
</script>
</body>
</html>
