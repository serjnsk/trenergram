<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page"><div class="pagewrap wide" style="padding-top:14px">
        <section class="pane" id="page"></section>
      </div></div>
  </div>
</div>
<div class="ov" id="ov"></div>
<script src="assets/exdb.js"></script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/dd.js"></script>
<script src="assets/ui.js"></script>
<script>
/* ═══════════ ДАШБОРД — лента важных событий + статистика аккаунта ═══════════
   Слева карточка во всю ширину с лентой в две колонки: «Требует действия»
   (вопросы, кончающиеся программы, пропуски, новые клиенты) и «Что
   произошло» (рекорды, записанные результаты, подписка). Справа — панель
   «Аккаунт»: цифры с трендом к прошлой неделе и очередь составления. */
/* Четыре карточки сверху — не счётчики, а ответ на вопрос «что мне сейчас делать»:
   каждая ведёт туда, где с этим работают. Рекорды и ответы на вопросы живут в
   ленте ниже, поэтому отдельных цифр не получают. */
function stats(){
  const pl = planNow(), n = CLIENTS.length, sub = subNow();
  const plan = scheduleAll(TODAY,TODAY).length, done = CLIENTS.filter(c=>c.prog && c.last===TODAY).length;
  const ending = composeQueue().filter(x=>x.runway<=7), idl = idle(), q = unread().length;
  return [
    {k:'Тренировки сегодня', ic:ICON.cal, href:'calendar.html', v: plan ? `${done} из ${plan}` : '0', bar: plan ? done/plan : 0,
     d: plan ? 'выполнено из назначенных на сегодня' : 'на сегодня ничего не назначено'},
    {k:'Нужно внимание', ic:ICON.prog, href:'clients.html', v:ending.length+idl.length, warn:ending.length+idl.length>0,
     rows: ending.length+idl.length ? [['Программа на исходе', ending.length], ['Нет тренировок 3+ дня', idl.length]] : null,
     d: ending.length+idl.length ? '' : 'все клиенты в графике'},
    {k:'Ждут ответа', ic:ICON.chat, feed:'q', v:q, acc:q>0, d: q ? 'вопросов клиентов — показать в ленте' : 'вопросов без ответа нет'},
    {k:'Аккаунт', ic:ICON.users, href:'profile.html', v:n,
     d:`${pl.price.toLocaleString('ru-RU')} ₽ в месяц · ${SUBRO ? (sub.trial ? 'пробный период закончился' : 'подписка закончилась') : sub.trial ? 'пробный период до' : sub.canceled ? 'подписка отменена, доступ до' : 'подписка до'} ${humanDate(sub.until)}`},
  ];
}
const kpiHTML = s => { const tag = s.href ? `a href="${s.href}"` : `button type="button" data-feed="${s.feed}"`, on = s.feed && F.types.size === 1 && F.types.has(s.feed);
  return `<${tag} class="kpi lnk${on?' on':''}"><span class="k">${s.ic} ${esc(s.k)}</span><div class="v ${s.acc?'acc':s.warn?'warn':''}">${s.v}</div>
    ${s.bar!=null?`<div class="kbar"><i style="width:${Math.round(s.bar*100)}%"></i></div>`:''}
    ${s.d?`<div class="d">${esc(s.d)}</div>`:''}
    ${s.rows?`<div class="rows">${s.rows.map(([t,n])=>`<div><span>${esc(t)}</span><b>${n}</b></div>`).join('')}</div>`:''}</${s.href?'a':'button'}>`;
};
const queueHTML = n => composeQueue().slice(0,n).map(x=>{ const c=client(x.p.clients[0]); const lbl = x.runway<0?'кончилась':x.runway===0?'сегодня':`${x.runway} ${plural(x.runway,'день','дня','дней')}`;
  return `<div class="act"><span class="n">${esc(c?c.ini:'—')}</span><span class="t">${esc(c?c.n:x.p.title)}<s>${esc(x.p.title)} · ${x.composed ? 'составлено до ' + dm(dayDate(x.p.id, x.composed-1)) : 'ничего не составлено'}</s></span><span class="chip ${x.runway<0?'rm':x.runway<=7?'warn':'ghost'}">${lbl}</span></div>`}).join('');
const actionsHTML = () => { const ev = events(); const un = ev.filter(e=>e.t==='q'), pg = ev.filter(e=>e.t==='prog'), ms = ev.filter(e=>e.t==='miss'), nw = ev.filter(e=>e.t==='new');
  const grp = (t, list, act) => list.length ? `<div class="rhead" style="padding-left:0">${t} · ${list.length}</div>${list.slice(0,4).map(e=>`<div class="act"><span class="n">${esc(e.c?e.c.ini:'—')}</span><span class="t">${esc(e.title)}<s>${e.tx.replace(/<[^>]+>/g,'').slice(0,60)}</s></span><a class="btn gh sm" href="${e.href}">${act}</a></div>`).join('')}` : '';
  return grp('Ответить', un, 'Ответить') + grp('Составить', pg, 'В конструктор') + grp('Написать клиенту', ms, 'Профиль') + grp('Назначить программу', nw, 'Назначить'); };


/* Одна лента, как в соцсети: хронология по дням, тип события — подписью и
   цветом у каждой записи. Над лентой два раскрывающихся фильтра: типы
   событий (несколько сразу) и период. Пустой выбор типов — все. */
const F = { types: new Set(), from: null, to: null, per: 'all' };
const PERIODS = [['all','За всё время'],['today','Сегодня'],['yest','Вчера'],['7','7 дней'],['30','30 дней']];
function perRange(k){ return k === 'today' ? [TODAY, TODAY] : k === 'yest' ? [addDays(TODAY,-1), addDays(TODAY,-1)] : k === '7' ? [addDays(TODAY,-6), TODAY] : k === '30' ? [addDays(TODAY,-29), TODAY] : [null, null] }
const inRange = e => (!F.from || e.d >= F.from) && (!F.to || e.d <= F.to);
const typeLabel = () => !F.types.size ? 'Все события' : F.types.size === 1 ? TYPES[[...F.types][0]] : TYPES[[...F.types][0]] + ' и ещё ' + (F.types.size - 1);
const perLabel = () => F.per !== 'custom' ? PERIODS.find(p => p[0] === F.per)[1]
  : F.from && F.to && F.from === F.to ? humanDate(F.from) : (F.from ? 'с ' + dm(F.from) : '') + (F.to ? ' по ' + dm(F.to) : '');
const DDCHEV = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l4 4 4-4"/></svg>';
let EV = [];
function render(){
  EV = feedEvents(); feedNewSet();
  const st = stats(), ob = onbHTML(), nw = feedNew();
  setTopTitle('Дашборд');
  $('#page').innerHTML = limitAlertHTML() + ob + `<div class="dkpis">${st.map(kpiHTML).join('')}</div>` + `
      <div class="feedh"><h2>Лента событий <span class="fnew">(${nw ? nw + ' ' + plural(nw,'новое','новых','новых') : 'новых событий нет'})</span></h2></div>
      <div class="ffl">
        <div class="fdd"><button class="fddb${F.types.size ? ' on' : ''}" id="fT" aria-haspopup="true" aria-expanded="false"><span>${esc(typeLabel())}</span>${DDCHEV}</button></div>
        <div class="fdd"><button class="fddb${F.per !== 'all' ? ' on' : ''}" id="fD" aria-haspopup="true" aria-expanded="false"><span>${esc(perLabel())}</span>${DDCHEV}</button></div>
        ${F.types.size || F.per !== 'all' ? '<button class="fclr" id="fX">Сбросить</button>' : ''}
      </div>
      <div class="feed1" id="feedList"></div>`;
  renderList();
  $('#fT').onclick = e => { e.stopPropagation(); togglePop('fT', typePop) };
  $('#fD').onclick = e => { e.stopPropagation(); togglePop('fD', datePop) };
  const x = $('#fX'); if(x) x.onclick = () => { F.types.clear(); F.per = 'all'; F.from = F.to = null; render() };
  $$('.kpi[data-feed]').forEach(b=>b.onclick=()=>{ const on = F.types.size === 1 && F.types.has(b.dataset.feed); F.types = new Set(on ? [] : [b.dataset.feed]); render(); if(!on) $('.feedh').scrollIntoView({behavior:'smooth', block:'start'}) });
  onbBind(render);
}
function renderList(){
  const list = EV.filter(e => (!F.types.size || F.types.has(e.t)) && inRange(e));
  $('#feedList').innerHTML = feedHTML(list);
  $$('.fev.t-pr .btn, .fev2.t-pr .fact').forEach(b=>b.onclick=e=>{ e.preventDefault(); toast('Проценты в назначенных тренировках пересчитаны от нового рекорда') });
}
/* Раскрывающийся список под кнопкой фильтра; закрывается по клику мимо и Esc. */
function togglePop(id, fill){
  const open = document.querySelector('.fpop'), was = open && open.dataset.for === id;
  closePop(); if(was) return;
  const b = $('#' + id), box = document.createElement('div'); box.className = 'fpop'; box.dataset.for = id;
  b.parentElement.appendChild(box); b.setAttribute('aria-expanded', 'true'); fill(box);
  setTimeout(() => { document.addEventListener('click', popOut, true); document.addEventListener('keydown', popKey, true) });
}
function closePop(){ const p = document.querySelector('.fpop'); if(p){ const b = $('#' + p.dataset.for); if(b) b.setAttribute('aria-expanded', 'false'); p.remove() }
  document.removeEventListener('click', popOut, true); document.removeEventListener('keydown', popKey, true) }
const popOut = e => { if(!e.target.closest('.fpop, .fddb, .dpick')) closePop() };
const popKey = e => { if(e.key === 'Escape') closePop() };
/* Типы — галочками, несколько сразу; число — сколько таких в выбранном периоде. */
function typePop(box){
  const cnt = t => EV.filter(e => e.t === t && inRange(e)).length;
  const ts = Object.keys(TYPES).filter(t => EV.some(e => e.t === t));
  box.innerHTML = `<label class="fopt all"><input type="checkbox" data-all ${F.types.size ? '' : 'checked'}><span>Все события</span><s>${EV.filter(inRange).length}</s></label>
    ${ts.map(t => `<label class="fopt"><input type="checkbox" data-ty="${t}" ${F.types.has(t) ? 'checked' : ''}><span>${TYPES[t]}</span><s>${cnt(t)}</s></label>`).join('')}`;
  box.querySelector('[data-all]').onchange = () => { F.types.clear(); sync() };
  box.querySelectorAll('[data-ty]').forEach(i => i.onchange = () => { i.checked ? F.types.add(i.dataset.ty) : F.types.delete(i.dataset.ty); sync() });
  /* Список остаётся открытым — выбирают несколько типов подряд; лента и подпись кнопки обновляются сразу. */
  const sync = () => { box.querySelector('[data-all]').checked = !F.types.size; box.querySelectorAll('[data-ty]').forEach(i => i.checked = F.types.has(i.dataset.ty));
    $('#fT span').textContent = typeLabel(); $('#fT').classList.toggle('on', !!F.types.size); renderList(); clrBtn() };
}
/* Период — быстрые варианты и свой диапазон «с … по …» тем же календариком. */
function datePop(box){
  const draw = () => { box.innerHTML = `${PERIODS.map(([k, t]) => `<button class="fopt${F.per === k ? ' sel' : ''}" data-per="${k}"><span>${t}</span></button>`).join('')}
    <div class="frng"><span>Период</span><button class="fdt" data-end="from">${F.from && F.per === 'custom' ? dm(F.from) : 'с …'}</button><button class="fdt" data-end="to">${F.to && F.per === 'custom' ? dm(F.to) : 'по …'}</button></div>`;
    box.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { F.per = b.dataset.per; [F.from, F.to] = perRange(F.per); closePop(); render() });
    box.querySelectorAll('[data-end]').forEach(b => b.onclick = e => { e.stopPropagation(); const end = b.dataset.end;
      openDatePicker(b, (end === 'from' ? F.from : F.to) || TODAY, d => {
        if(F.per !== 'custom'){ F.per = 'custom'; F.from = F.to = null }
        F[end] = d; if(F.from && F.to && F.from > F.to) [F.from, F.to] = [F.to, F.from];
        $('#fD span').textContent = perLabel(); $('#fD').classList.add('on'); renderList(); clrBtn(); draw() }) }) };
  draw();
}
function clrBtn(){ const has = F.types.size || F.per !== 'all', x = $('#fX');
  if(has && !x){ $('.ffl').insertAdjacentHTML('beforeend', '<button class="fclr" id="fX">Сбросить</button>'); $('#fX').onclick = () => { F.types.clear(); F.per = 'all'; F.from = F.to = null; render() } }
  if(!has && x) x.remove() }
render();
initShell({page:'index.html', title:'Дашборд'});
</script>
</body>
</html>
