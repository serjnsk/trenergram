<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль · Тренерграм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base-trainer.css">
<link rel="stylesheet" href="assets/theme-01-strava.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page"><div class="pagewrap">
        <div class="phead" id="pagehead"></div>
        <div id="page"></div>
      </div></div>
  </div>
</div>
<div class="ov" id="ov"></div>
<script src="assets/exdb.js"></script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/dd.js"></script>
<script src="assets/ui.js"></script>
<script>
/* ═══════════ ПРОФИЛЬ ТРЕНЕРА ═══════════
   Настройки аккаунта, а не витрина бренда (BRD-1 — за пределами MVP):
   основные данные, подписка и лимит клиентов, безопасность. Виды спорта,
   часовой пояс и уведомления убраны. Приглашение клиентов (REG-1) живёт здесь
   же — это свойство аккаунта тренера. «Сообщение по оплате занятий» — текст
   для оплаты занятий (PAY-9): клиент видит его, когда пора платить.
   Фото загружается по нажатию на сам аватар; в прототипе — уменьшенная копия
   в STATE.profile.photo, на бэкенде будет загрузка в хранилище. */
const P = (STATE.profile ||= JSON.parse(JSON.stringify(PROFILE_DEF)));
const T = TRAINER;
if(P.invite) T.invite = P.invite;
/* Новая ссылка-приглашение: случайный код без похожих букв и цифр (0/O, 1/I) */
const newInvite = () => 'https://trenergram.app/j/' + Array.from({length:6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const save = msg => { saveState(); if(msg) toast(msg) };
const plan = () => PLANS.find(x=>x.id===P.sub.plan) || PLANS[1];
const rub = n => n.toLocaleString('ru-RU') + ' ₽';
const MONG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dlong = iso => { const d = new Date(iso+'T00:00:00'); return d.getDate()+' '+MONG[d.getMonth()]+' '+d.getFullYear() };
const dshort = iso => { const d = new Date(iso+'T00:00:00'); return d.getDate()+' '+MONG[d.getMonth()].slice(0,3)+' '+d.getFullYear() };
const daysLeft = iso => daysBetween(TODAY, iso);
const CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
/* Фото — квадрат 160 px из середины кадра: в localStorage влезает, на аватаре 64 px резко */
function photoFrom(file, done){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const c = document.createElement('canvas'), n = 160, m = Math.min(img.width, img.height);
    c.width = c.height = n;
    c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, n, n);
    URL.revokeObjectURL(url); done(c.toDataURL('image/jpeg', .85));
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Не получилось открыть файл — нужна картинка JPG или PNG') };
  img.src = url;
}

function render(){
  const pl = plan(), used = CLIENTS.length, left = daysLeft(P.sub.until), over = used > pl.limit;
  $('#page').innerHTML = `
  <div class="prof">
    <div>
      <div class="sechead"><span class="t">Основные данные</span><span class="ln"></span></div>
      <div class="card cb">
        <div class="avrow">
          <label class="av av-up${P.photo?' has':''}" title="${P.photo?'Сменить фото':'Загрузить фото'}">
            ${P.photo?`<img src="${P.photo}" alt="">`:esc(T.ini)}<span class="av-cam">${CAMERA}</span>
            <input type="file" id="inPhoto" accept="image/*" hidden></label>
          <span class="av-t"><b>${esc(T.first)} ${esc(T.last)}</b><s>${P.photo?'Нажмите на фото, чтобы сменить':'Нажмите на кружок, чтобы загрузить фото'}</s></span>
        </div>
        <div class="cols2" style="margin-bottom:12px">
          <div class="formfld"><span class="k">Имя</span><input class="inp" data-t="first" value="${esc(T.first)}"></div>
          <div class="formfld"><span class="k">Фамилия</span><input class="inp" data-t="last" value="${esc(T.last)}"></div>
        </div>
        <div class="cols2" style="margin-bottom:12px">
          <div class="formfld"><span class="k">Телефон</span><input class="inp" data-t="phone" value="${esc(T.phone)}"></div>
          <div class="formfld"><span class="k">Email</span><input class="inp" data-t="email" value="${esc(T.email)}"></div>
        </div>
        <div class="cols2" style="margin-bottom:12px">
          <div class="formfld"><span class="k">Город</span><input class="inp" data-t="city" value="${esc(T.city)}"></div>
        </div>
        <div class="formfld"><span class="k">О себе — видят клиенты</span>
          <textarea class="inp" data-t="about" rows="3">${esc(T.about)}</textarea></div>
      </div>

      <div class="sechead"><span class="t">Приглашение клиентов</span><span class="ln"></span></div>
      <div class="card cb">
        <div class="copyfield"><code title="${esc(T.invite)}"><span>${esc(T.invite.replace(/[^/]+$/,''))}</span><b>${esc(T.invite.split('/').pop())}</b></code><button class="btn gh sm" id="btnCopy">Скопировать</button></div>
        <div class="hint">Одна ссылка для всех клиентов, без срока. Клиент открывает её, входит по номеру телефона и сразу привязан к вам. Список — в «Клиентах».</div>
        <button class="lnk-new" id="btnNewLink">Выпустить новую ссылку</button>
      </div>

      <div class="sechead"><span class="t">Сообщение по оплате занятий для клиентов</span><span class="ln"></span></div>
      <div class="card cb">
        <div class="formfld"><textarea class="inp" id="payHow" rows="2" aria-label="Сообщение по оплате занятий для клиентов" placeholder="Например: перевод по номеру телефона, банк, получатель">${esc(payHow())}</textarea></div>
        <div class="hint">Клиент видит этот текст, когда пора платить: за день до конца оплаты, в последний день и когда доступ к новым тренировкам закрыт. Сумму и срок каждому клиенту задаёте в его карточке.</div>
      </div>

      <div class="sechead"><span class="t">Безопасность</span><span class="ln"></span></div>
      <div class="card cb">
        <div class="setrow"><span class="t"><b>Пароль</b><s>Вход по телефону и паролю</s></span><button class="btn gh sm" id="btnPass">Сменить пароль</button></div>
      </div>
    </div>

    <div class="side">
      <div class="sechead"><span class="t">Подписка</span><span class="ln"></span></div>
      <div class="card cb subc">
        <div class="subc-h">
          <span class="pl">${esc(pl.n)}</span><span class="chip ${left>0?'ok':'rm'}">${left>0?'активна':'истекла'}</span>
          <span class="pr">${rub(pl.price)}<s> / мес</s></span>
        </div>
        <div class="usage${over?' over':''}"><div class="l"><span>Клиентов</span><b>${used} из ${pl.limit}</b></div><div class="bar"><i style="width:${Math.min(100,used/pl.limit*100)}%"></i></div>
          ${over?`<div class="uwarn">Перерасход: ${used-pl.limit} ${plural(used-pl.limit,'клиент','клиента','клиентов')} сверх лимита</div>`:''}</div>
        <div class="subc-rows">
          <div class="r"><s>Оплачено до</s><b>${dshort(P.sub.until)}${left>0?` <i>· ${left} ${plural(left,'день','дня','дней')}</i>`:''}</b></div>
          <div class="r"><s>Следующий платёж</s><b>${dshort(P.sub.until)}</b></div>
          <div class="r"><s>Способ оплаты</s><b>${esc(P.sub.card)}</b></div>
        </div>
        <div class="subc-acts"><button class="btn" id="btnPlan">Сменить тариф</button><button class="btn gh" id="btnHist">История платежей</button></div>
        <div class="subc-foot"><button class="lnk-rm" id="btnCancel">Отменить подписку</button></div>
      </div>
    </div>
  </div>`;

  $$('[data-t]').forEach(i=>i.onchange=e=>{ T[i.dataset.t]=e.target.value.trim(); if(i.dataset.t==='first'||i.dataset.t==='last'){ T.n=(T.first+' '+T.last).trim(); T.ini=(T.first[0]||'')+(T.last[0]||''); renderNav('profile.html') } save('Сохранено'); if(i.dataset.t!=='about') render() });
  $('#payHow').onchange=e=>{ P.payHow=e.target.value.trim(); save('Сохранено') };
  $('#inPhoto').onchange=e=>{ const f=e.target.files[0]; if(f) photoFrom(f, url=>{ P.photo=url; save('Фото обновлено'); render() }) };
  $('#btnCopy').onclick=()=>{ navigator.clipboard?.writeText(T.invite); toast('Ссылка скопирована') };
  $('#btnNewLink').onclick=()=>openModal({title:'Новая ссылка', body:`<p class="lead">Прежняя ссылка сразу перестанет работать: кто откроет её, увидит «Ссылка устарела» и просьбу запросить новую у тренера. Клиенты, которые уже пришли, останутся с вами.</p>`,
    foot:`<span class="sp"></span><button class="btn gh" data-close>Отмена</button><button class="btn" data-close id="mdNewLink">Выпустить</button>`});
  $('#btnPass').onclick=()=>openModal({title:'Сменить пароль', body:`
      <div class="formfld" style="margin-bottom:10px"><span class="k">Текущий пароль</span><input class="inp" type="password"></div>
      <div class="cols2"><div class="formfld"><span class="k">Новый пароль</span><input class="inp" type="password"></div>
      <div class="formfld"><span class="k">Ещё раз</span><input class="inp" type="password"></div></div>`,
    foot:`<span class="sp"></span><button class="btn gh" data-close>Отмена</button><button class="btn" id="mdPass">Сохранить</button>`});
  $('#btnPlan').onclick=()=>openModal({title:'Тариф', wide:true, body:`<div class="plans">${PLANS.map(x=>`<div class="plan ${x.id===P.sub.plan?'on':''}"><b>${esc(x.n)}</b><span class="pr">${rub(x.price)} <s>/ мес</s></span><s>до ${x.limit} клиентов · ${esc(x.d)}</s>
      <button class="btn ${x.id===P.sub.plan?'gh':''} sm" data-plan="${x.id}" ${x.id===P.sub.plan?'disabled':''}>${x.id===P.sub.plan?'Текущий':'Выбрать'}</button></div>`).join('')}</div><div class="hint">Смена тарифа вступает в силу со следующего платежа; лимит клиентов — сразу.</div>`});
  $('#btnHist').onclick=()=>openModal({title:'История платежей', body:`<table class="tbl"><thead><tr><th>Дата</th><th>Тариф</th><th class="r">Сумма</th><th>Карта</th></tr></thead><tbody>
      ${['2026-09-12','2026-08-12','2026-07-12','2026-06-12'].map(d=>`<tr><td>${dlong(d)}</td><td>${esc(pl.n)} · месяц</td><td class="r">${rub(pl.price)}</td><td>${esc(P.sub.card)}</td></tr>`).join('')}</tbody></table>`});
  $('#btnCancel').onclick=()=>openModal({title:'Отменить подписку', body:`<p class="lead">Доступ сохранится до <b>${dlong(P.sub.until)}</b>, потом кабинет станет только для чтения: клиенты увидят уже назначенные тренировки, новые назначить будет нельзя.</p>`,
    foot:`<span class="sp"></span><button class="btn gh" data-close>Оставить подписку</button><button class="btn rm" data-close id="mdCancel">Отменить</button>`});
}
document.addEventListener('click', e=>{
  if(e.target.closest('[data-close]') || e.target===$('#ov')) closeModal();
  const pl = e.target.closest('[data-plan]'); if(pl){ P.sub.plan=pl.dataset.plan; save('Тариф изменён — с ' + dlong(P.sub.until)); closeModal(); render() }
  if(e.target.closest('#mdPass')){ closeModal(); toast('Пароль изменён') }
  if(e.target.closest('#mdCancel')) toast('Подписка отменена — доступ до ' + dlong(P.sub.until));
  if(e.target.closest('#mdNewLink')){ P.invite = T.invite = newInvite(); save('Новая ссылка готова — прежняя больше не работает'); render() }
});
render();
initShell({page:'profile.html', title:'Профиль'});
</script>
</body>
</html>
