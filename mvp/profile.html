<script>
/* ═══════════ ПРОФИЛЬ ТРЕНЕРА ═══════════
   Настройки аккаунта, а не витрина бренда (BRD-1 — за пределами MVP):
   таб «Профиль» — данные, приглашение, реквизиты, вход; таб «Подписка» —
   тариф, лимит клиентов, карта, баланс, история платежей; таб «Партнёрская программа» —
   ссылка для тренеров и партнёрский счёт. Виды спорта,
   часовой пояс и уведомления убраны. Приглашение клиентов (REG-1) живёт здесь
   же — это свойство аккаунта тренера. «Реквизиты для оплаты занятий» — текст
   для оплаты занятий (PAY-9): клиент видит его, когда пора платить.
   Фото загружается по нажатию на сам аватар; в прототипе — уменьшенная копия
   в STATE.profile.photo, на бэкенде будет загрузка в хранилище. */
const P = (STATE.profile ||= JSON.parse(JSON.stringify(PROFILE_DEF)));
const T = TRAINER;
if(P.invite) T.invite = P.invite;
/* Новая ссылка-приглашение: случайный код без похожих букв и цифр (0/O, 1/I) */
const newInvite = () => 'https://trenergram.app/j/' + Array.from({length:6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const save = msg => { saveState(); if(msg) toast(msg) };
const plan = () => PLANS.find(x=>x.id===P.sub.plan) || PLANS[0];
const rub = n => n.toLocaleString('ru-RU') + ' ₽';
const MONG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dlong = iso => { const d = new Date(iso+'T00:00:00'); return d.getDate()+' '+MONG[d.getMonth()]+' '+d.getFullYear() };
const daysLeft = iso => daysBetween(TODAY, iso);
const CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
/* Фото — квадрат 160 px из середины кадра: в localStorage влезает, на аватаре 64 px резко */
function photoFrom(file, done){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const c = document.createElement('canvas'), n = 160, m = Math.min(img.width, img.height);
    c.width = c.height = n;
    c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, n, n);
    URL.revokeObjectURL(url); done(c.toDataURL('image/jpeg', .85));
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Не получилось открыть файл — нужна картинка JPG или PNG') };
  img.src = url;
}

/* Три таба: «Профиль» — всё, что про тренера и его клиентов (данные, ссылка,
   реквизиты, вход); «Подписка» — оплата Тренерграма; «Партнёрская программа» — ссылка для
   тренеров и партнёрский счёт. Таб — в хэше адреса, поэтому плашка пробного
   периода и баннер перерасхода ведут сразу в #billing. */
const TABS = [['profile','Профиль','<circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5"/>'],
              ['billing','Подписка','<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/>'],
              ['partner','Партнёрская программа','<path d="M18.5 5.5l-13 13"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>']];
const tab = () => ({'#billing':'billing', '#partner':'partner'})[location.hash] || 'profile';
const row = (label, desc, ctl) => `<div class="srow"><div class="sl"><b>${label}</b>${desc?`<s>${desc}</s>`:''}</div><div class="sc">${ctl}</div></div>`;

function profileTab(){
  return `
    <div class="sechead"><span class="t">Как вас видят клиенты</span><span class="ln"></span></div>
    <div class="card cb">
      ${row('Фото', '', `<div class="avrow">
        <label class="av av-up${P.photo?' has':''}" for="inPhoto" title="${P.photo?'Сменить фото':'Загрузить фото'}">
          ${P.photo?`<img src="${P.photo}" alt="">`:esc(T.ini)}<span class="av-cam">${CAMERA}</span></label>
        <label class="btn gh sm" for="inPhoto">${P.photo?'Сменить фото':'Загрузить фото'}</label>
        <input type="file" id="inPhoto" accept="image/*" hidden></div>`)}
      ${row('Имя и фамилия', '', `<div class="cols2"><input class="inp" data-t="first" value="${esc(T.first)}" placeholder="Имя" aria-label="Имя"><input class="inp" data-t="last" value="${esc(T.last)}" placeholder="Фамилия" aria-label="Фамилия"></div>`)}
      ${row('Город', '', `<input class="inp" data-t="city" value="${esc(T.city)}">`)}
      ${row('О себе', '', `<textarea class="inp" data-t="about" rows="3">${esc(T.about)}</textarea>`)}
    </div>

    <div class="sechead"><span class="t">Приглашение клиентов</span><span class="ln"></span></div>
    <div class="card cb">
      ${inviteBlockHTML()}
    </div>

    <div class="sechead"><span class="t">Реквизиты для оплаты занятий</span><span class="ln"></span></div>
    <div class="card cb">
      <textarea class="inp" id="payHow" rows="3" aria-label="Реквизиты для оплаты занятий" placeholder="Например: перевод по номеру телефона, банк, получатель">${esc(payHow())}</textarea>
      <div class="hint">Клиент видит их, когда подходит срок оплаты. Сумму и срок задаёте в карточке клиента.</div>
    </div>

    <div class="sechead"><span class="t">Вход в кабинет</span><span class="ln"></span></div>
    <div class="card cb">
      ${row('Телефон', 'Логин для входа', `<input class="inp" data-t="phone" value="${esc(T.phone)}">`)}
      ${row('Email', 'Чеки и восстановление пароля', `<input class="inp" data-t="email" value="${esc(T.email)}">`)}
      ${row('Пароль', '', `<div class="pwrow"><span>••••••••</span><button class="btn gh sm" id="btnPass">Сменить пароль</button></div>`)}
    </div>`;
}

/* Подписка — две карточки, как биллинг Shopify. В первой сводка строкой ячеек:
   текущий тариф, клиенты из лимита, стоимость и до какого числа действует;
   под ней карта, внизу полосой — следующий платёж и отмена. Вторая — история. */
const PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const dnum = iso => iso.split('-').reverse().join('.');
const cell = (k, v, cls='') => `<div class="bst${cls?' '+cls:''}"><s>${k}</s><b>${v}</b></div>`;
function billingTab(){
  const pl = plan(), used = CLIENTS.length, left = daysLeft(P.sub.until);
  const trial = !!P.sub.trial, nocard = !/\d/.test(P.sub.card||''), hist = payHist();
  /* Отменённая подписка: доступ до конца оплаченного срока, списаний больше нет.
     Сверху карточки — плашка с датой и «Возобновить», точка у даты жёлтая,
     в полосе снизу вместо следующего платежа — «списаний не будет». */
  const ended = SUBRO, off = !!P.sub.canceled && !trial && !ended;
  /* Срок прошёл (оплата не прошла, подписку отменили или кончился пробный) —
     кабинет только для просмотра (SUBRO, data.js); здесь — «Продлить». */
  const brand = (P.sub.card||'').split(' ')[0], bal = P.balance || 0;
  return `
    <div class="card bcard">
      <div class="bc-b">
        <div class="bc-h"><b>Подписка</b>${off?'':`<button class="lnk-t" id="btnPlan">${trial&&!ended?'Выбрать тариф':'Сменить тариф'}</button>`}</div>
        ${ended?`<div class="bnote end"><span><b>${trial?'Пробный период закончился':'Подписка закончилась'} ${dlong(P.sub.until)}.</b> Кабинет открыт только для просмотра — после продления снова можно составлять тренировки и добавлять клиентов.</span><button class="btn sm" id="btnRenew">Продлить подписку</button></div>`
        : off?`<div class="bnote"><span><b>Подписка отменена.</b> Доступ сохранится до ${dlong(P.sub.until)}, потом кабинет станет только для просмотра.</span><button class="btn sm" id="btnResume">Возобновить</button></div>`:''}
        <div class="bstats">
          ${cell('Текущий тариф', trial?'Пробный период':esc(pl.n), 'pl')}
          ${cell('Клиентов', used)}
          ${cell('Стоимость', `${trial&&!ended?0:pl.price.toLocaleString('ru-RU')}<i> ₽/мес</i>`)}
          ${cell('Действует до', `<span class="dot ${left>0?(left<=3||off?'warn':'ok'):'rm'}"></span>${dnum(P.sub.until)}`)}
        </div>
        <div class="pmbox">${nocard
          ? `<span class="pm-t">Карта не привязана</span><button class="btn sm" id="btnCard">Привязать карту</button>`
          : `<span class="pm-br">${esc(brand)}</span><span class="pm-t">${esc(P.sub.card)}</span><button class="iact" id="btnCard" title="Изменить карту" aria-label="Изменить карту">${PEN}</button>`}</div>
        <div class="pmbox pm-bal"><span class="pm-br">₽</span><span class="pm-t">${bal
          ? `<b>${rub(bal)}</b> на балансе аккаунта — спишем в счёт следующего платежа`
          : 'Баланс аккаунта пуст — пополняется из партнёрской программы'}</span><a class="lnk-t" href="#partner">${bal?'Пополнить':'Подробнее'}</a></div>
      </div>
      <div class="bc-f"><span>${ended
        ? `Продление — ${rub(pl.price)} за месяц, ${esc(pl.n)}; доступ откроется сразу`
        : trial
        ? `Потом — ${rub(pl.price)} в месяц, ${esc(pl.n)}`
        : off ? `Автопродление выключено — списаний больше не будет`
        : left>0 ? `Следующий платёж ${rub(pl.price)} — ${dlong(P.sub.until)}, через ${left} ${plural(left,'день','дня','дней')}${bal?`: ${bal>=pl.price?'всё с баланса':`${rub(bal)} с баланса, ${rub(pl.price-bal)} с карты`}`:''}` : `Подписка закончилась ${dlong(P.sub.until)}`}</span>
        ${trial||off||ended?'':'<button class="lnk-t" id="btnCancel">Отменить подписку</button>'}</div>
    </div>

    <div class="card bcard">
      <div class="bc-b">
        <div class="bc-h"><b>История платежей</b></div>
        ${hist.length?`<div class="tblwrap bc-tbl"><table class="tbl"><thead><tr><th>Дата</th><th class="bh-pl">Назначение</th><th class="r">Сумма</th><th>Статус</th></tr></thead><tbody>
          ${hist.map(d=>`<tr><td class="nw">${dlong(d)}</td><td class="bh-pl">Подписка на месяц · ${esc(pl.n)}</td><td class="r nw">${rub(pl.price)}</td><td><span class="chip ok">оплачен</span></td></tr>`).join('')}</tbody></table></div>`
          :'<div class="bc-s">Платежей пока не было</div>'}
      </div>
    </div>`;
}
/* История в прототипе — ежемесячные списания до даты продления, не раньше начала подписки */
const payHist = () => P.sub.trial ? [] : [1,2,3,4].map(k=>{ const d = new Date(P.sub.until+'T00:00:00'); d.setMonth(d.getMonth()-k); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }).filter(d=>d<=TODAY && d>=(P.sub.since||''));

/* ═══════════ ПАРТНЁРСКАЯ ПРОГРАММА ═══════════
   Тренер приводит тренеров по своей ссылке и получает процент с каждой их
   оплаты подписки. Начисления копятся на партнёрском счёте; оттуда тренер
   переводит их на баланс аккаунта (P.balance), а баланс уходит в счёт
   следующего платежа за подписку. Процент задаёт администратор — общий
   для всех или свой у тренера. «Вывод средств» по умолчанию выключен;
   включённый — это заявка: администратор связывается с тренером и платит
   вне сервиса, до выплаты сумма в резерве. Начисление помнит процент,
   по которому посчитано: смена процента прошлое не пересчитывает.
   Демо: ?payout=1 — администратор включил вывод средств, ?payout=0 — выключил. */
const PRT_DEF = {pct:20, payout:false, link:'https://trenergram.ru/p/K7F2QX', invited:3, paying:2, balance:800,
  ops:[[3,'in',1990,'Анна Лебедева'], [14,'in',490,'Дмитрий Орлов'], [20,'bal',800], [33,'in',1990,'Анна Лебедева'],
       [44,'in',490,'Дмитрий Орлов'], [63,'in',1990,'Анна Лебедева']]
    .map(([d,k,n,who]) => k==='in' ? {at:addDays(TODAY,-d), k, base:n, pct:20, sum:Math.round(n*.2), who} : {at:addDays(TODAY,-d), k, sum:n})};
const PRT = STATE.partner ||= (()=>{ const r = JSON.parse(JSON.stringify(PRT_DEF)); P.balance ??= r.balance; delete r.balance; return r })();
{ const m = /[?&]payout=(1|0)\b/.exec(location.search); if(m){ PRT.payout = m[1]==='1'; saveState() } }
/* Доступно: начисления минус переводы на баланс и выводы; отклонённая заявка возвращает сумму */
const prtEarned = () => PRT.ops.filter(o=>o.k==='in').reduce((s,o)=>s+o.sum, 0);
const prtAvail = () => PRT.ops.reduce((s,o)=> o.k==='in' ? s+o.sum : o.st==='no' ? s : s-o.sum, 0);
const prtOp = o => o.k==='in' ? `Оплата подписки · ${esc(o.who)}<div class="sub">${rub(o.base)} × ${o.pct}%</div>`
  : o.k==='bal' ? 'Перевод на баланс аккаунта'
  : `Вывод средств <span class="chip ${({new:'warn', paid:'ok', no:'rm'})[o.st]}">${({new:'ждёт выплаты', paid:'выплачено', no:'отклонено'})[o.st]}</span>`;

function partnerTab(){
  const av = prtAvail(), [base, code] = [PRT.link.replace(/^https:\/\//,'').replace(/[^/]+$/,''), PRT.link.split('/').pop()];
  const ops = [...PRT.ops].reverse().sort((a,b)=> a.at<b.at ? 1 : a.at>b.at ? -1 : 0);   /* за один день — последняя сверху */
  return `
    <div class="card bcard">
      <div class="bc-b">
        <div class="bc-h"><b>Партнёрская программа</b></div>
        <div class="bc-s">Приглашайте тренеров по своей ссылке — с каждой их оплаты подписки вы получаете ${PRT.pct}%. Начисленное переводите на баланс аккаунта: оно пойдёт в счёт оплаты Тренерграма.</div>
        <div class="invbox prt-link"><code>${esc(base)}<b>${esc(code)}</b></code><button class="btn" id="prtCopy">Скопировать ссылку</button></div>
        <div class="bstats">
          ${cell('Ваш процент', PRT.pct + '%')}
          ${cell('Приглашено', `${PRT.invited}<i> · платят ${PRT.paying}</i>`)}
          ${cell('Заработано всего', rub(prtEarned()))}
          ${cell('Доступно', rub(av), 'pl')}
        </div>
      </div>
      <div class="bc-f prt-f"><span>${P.balance ? `На балансе аккаунта ${rub(P.balance)} — пойдёт в оплату подписки` : 'Баланс аккаунта пуст'}</span>
        ${PRT.payout ? `<button class="btn gh sm" id="prtOut"${av?'':' disabled'}>Вывести</button>` : ''}
        <button class="btn sm" id="prtBal"${av?'':' disabled'}>Перевести на баланс</button></div>
    </div>

    <div class="card bcard">
      <div class="bc-b">
        <div class="bc-h"><b>Движение по счёту</b></div>
        ${ops.length ? `<div class="tblwrap bc-tbl"><table class="tbl prt-tbl"><thead><tr><th>Дата</th><th>Операция</th><th class="r">Сумма</th></tr></thead><tbody>
          ${ops.map(o=>`<tr class="${o.st==='no'?'off':''}"><td class="nw">${o.at.slice(0,4)===TODAY.slice(0,4) ? dlong(o.at).replace(/ \d{4}$/,'') : dlong(o.at)}</td><td>${prtOp(o)}</td><td class="r nw ${o.k==='in'?'plus':''}">${o.k==='in'?'+':'−'}${rub(o.sum)}</td></tr>`).join('')}</tbody></table></div>`
          : '<div class="bc-s">Начислений пока не было — они появятся после первой оплаты приглашённого тренера</div>'}
      </div>
    </div>`;
}

/* Перевод на баланс и заявка на вывод — одно окно с суммой: по умолчанию всё доступное */
function prtModal(out){
  const av = prtAvail();
  openModal({title: out ? 'Вывести средства' : 'Перевести на баланс', body:`
    <p class="lead">${out
      ? 'Оставьте заявку — администратор Тренерграма свяжется с вами и договорится о выплате. Пока заявка ждёт, сумма в резерве.'
      : 'Деньги перейдут на баланс аккаунта и пойдут в счёт следующего платежа за подписку. Вывести их с баланса будет нельзя.'}</p>
    <div class="formfld prt-sum"><span class="k">Сумма, ₽</span><input class="inp" id="prtSum" type="number" min="1" max="${av}" step="1" value="${av}" inputmode="numeric"></div>
    <div class="hint" id="prtNote"></div>`,
    foot:`<span class="sp"></span><button class="btn gh" data-close>Отмена</button><button class="btn" id="mdPrt"></button>`});
  const inp = $('#prtSum'), go = $('#mdPrt');
  const sync = () => {
    const n = Math.floor(+inp.value || 0), ok = n >= 1 && n <= av;
    go.disabled = !ok; go.textContent = (out ? 'Отправить заявку на ' : 'Перевести ') + (ok ? rub(n) : '');
    $('#prtNote').innerHTML = n > av ? `Доступно только ${rub(av)}` : out ? `Свяжемся с вами по номеру ${esc(T.phone)}` : `Доступно ${rub(av)}`;
  };
  inp.oninput = sync; sync(); inp.select();
  go.onclick = () => {
    const n = Math.floor(+inp.value);
    PRT.ops.push(out ? {at:TODAY, k:'out', sum:n, st:'new'} : {at:TODAY, k:'bal', sum:n});
    if(!out) P.balance = (P.balance||0) + n;
    closeModal(); save(out ? 'Заявка отправлена — администратор свяжется с вами' : rub(n) + ' на балансе аккаунта'); render();
  };
}

function bindPartner(){
  $('#prtCopy').onclick = () => { try{ navigator.clipboard.writeText(PRT.link) }catch(_){} toast('Ссылка скопирована — отправьте её тренеру') };
  $('#prtBal').onclick = () => prtModal(false);
  $('#prtOut')?.addEventListener('click', () => prtModal(true));
}

function render(){
  const t = tab();
  $('#page').innerHTML = `
  <nav class="ptabs">${TABS.map(([k,n,ic])=>`<a href="#${k}" class="${k===t?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">${ic}</svg>${n}</a>`).join('')}</nav>
  <div class="prof">${t==='billing'?billingTab():t==='partner'?partnerTab():profileTab()}</div>`;
  t==='billing' ? bindBilling() : t==='partner' ? bindPartner() : bindProfile();
  /* На телефоне табы не помещаются и прокручиваются вбок — открытый таб должен быть виден */
  const nav = $('.ptabs'), on = nav.querySelector('.on'), right = on.offsetLeft - nav.offsetLeft + on.offsetWidth + 16;
  if(right > nav.clientWidth) nav.scrollLeft = right - nav.clientWidth;
}

function bindProfile(){
  $$('[data-t]').forEach(i=>i.onchange=e=>{ T[i.dataset.t]=e.target.value.trim(); if(i.dataset.t==='first'||i.dataset.t==='last'){ T.n=(T.first+' '+T.last).trim(); T.ini=(T.first[0]||'')+(T.last[0]||''); renderNav('profile.html') } save('Сохранено'); if(i.dataset.t!=='about') render() });
  $('#payHow').onchange=e=>{ P.payHow=e.target.value.trim(); save('Сохранено') };
  $('#inPhoto').onchange=e=>{ const f=e.target.files[0]; if(f) photoFrom(f, url=>{ P.photo=url; save('Фото обновлено'); render() }) };
  inviteBlockBind();
  $('#btnPass').onclick=()=>openModal({title:'Сменить пароль', body:`
      <div class="formfld" style="margin-bottom:10px"><span class="k">Текущий пароль</span><input class="inp" type="password"></div>
      <div class="cols2"><div class="formfld"><span class="k">Новый пароль</span><input class="inp" type="password"></div>
      <div class="formfld"><span class="k">Ещё раз</span><input class="inp" type="password"></div></div>`,
    foot:`<span class="sp"></span><button class="btn gh" data-close>Отмена</button><button class="btn" id="mdPass">Сохранить</button>`});
}

/* Смена тарифа — как блок цен на лендинге: один тариф, ступень выбирается
   ползунком по числу клиентов. Сразу стоит текущая ступень, а при перерасходе —
   первая, куда помещаются все клиенты. Лимит меняется сразу, цена — со
   следующего платежа (в пробный период — с первого). */
function planModal(){
  const used = CLIENTS.length, cur = PLANS.findIndex(x=>x.id===P.sub.plan);
  let i = used > PLANS[cur].limit ? PLANS.findIndex(x=>x.limit>=used) : cur;
  openModal({title:'Тариф', body:`
    <p class="lead">Все возможности на любой ступени — цена зависит только от числа клиентов.</p>
    <div class="tpick">
      <div class="tp-top"><div class="tp-price"><b id="tpPrice"></b><s>/ месяц</s></div><span class="tp-lim" id="tpLim"></span></div>
      <input type="range" id="tpRange" min="0" max="${PLANS.length-1}" step="1" aria-label="Количество клиентов">
      <div class="tp-ticks">${PLANS.map((x,k)=>`<button type="button" data-tp="${k}">${x.t}</button>`).join('')}</div>
    </div>
    <div class="hint" id="tpNote"></div>`,
    foot:`<span class="sp"></span><button class="btn gh" data-close>Отмена</button><button class="btn" id="mdPlan"></button>`});
  const set = k => {
    i = k; const x = PLANS[k], same = k === cur;
    $('#tpRange').value = k; $('#tpRange').style.setProperty('--p', k/(PLANS.length-1)*100 + '%');
    $('#tpPrice').textContent = rub(x.price); $('#tpLim').textContent = x.n;
    $$('[data-tp]').forEach((b,n)=>b.classList.toggle('on', n===k));
    $('#tpNote').innerHTML = same ? 'Это ваш текущий тариф.'
      : P.sub.trial ? `После пробного периода — ${rub(x.price)} в месяц, с ${dlong(P.sub.until)}.`
      : `Новая цена — со следующего платежа, ${dlong(P.sub.until)}.`;
    $('#mdPlan').disabled = same; $('#mdPlan').textContent = same ? 'Текущий тариф' : 'Перейти на ' + rub(x.price) + ' в месяц';
  };
  $('#tpRange').oninput = e => set(+e.target.value);
  $$('[data-tp]').forEach(b=>b.onclick=()=>set(+b.dataset.tp));
  $('#mdPlan').onclick = () => { P.sub.plan = PLANS[i].id; save('Тариф изменён: ' + PLANS[i].n); closeModal(); render() };
  set(i);
}

function bindBilling(){
  $('#btnPlan')?.addEventListener('click', planModal);
  $('#btnCard').onclick=()=>openModal({title:'Способ оплаты', body:`<p class="lead">Карту привязываем на защищённой странице банка — данные карты Тренерграм не хранит. В прототипе этот шаг не открывается.</p>`,
    foot:`<span class="sp"></span><button class="btn" data-close>Понятно</button>`});
  $('#btnRenew')?.addEventListener('click', ()=>{ Object.assign(P.sub, {until:addDays(TODAY, 30), canceled:false, trial:false}); SUBRO = false; save('Подписка продлена до ' + dlong(P.sub.until) + ' — кабинет снова открыт для правки'); render(); renderTop({title:'Профиль'}) });
  $('#btnResume')?.addEventListener('click', ()=>{ P.sub.canceled = false; save('Подписка возобновлена — следующий платёж ' + dlong(P.sub.until)); render(); renderTop({title:'Профиль'}) });
  $('#btnCancel')?.addEventListener('click', ()=>openModal({title:'Отменить подписку', body:`<p class="lead">Доступ сохранится до <b>${dlong(P.sub.until)}</b>, потом кабинет станет только для чтения: клиенты увидят уже назначенные тренировки, новые назначить будет нельзя.</p>`,
    foot:`<span class="sp"></span><button class="btn gh" data-close>Оставить подписку</button><button class="btn rm" data-close id="mdCancel">Отменить</button>`}));
}
window.addEventListener('hashchange', ()=>{ render(); scrollTo(0,0) });
document.addEventListener('click', e=>{
  if(e.target.closest('[data-close]') || e.target===$('#ov')) closeModal();
  if(e.target.closest('#mdPass')){ closeModal(); toast('Пароль изменён') }
  if(e.target.closest('#mdCancel')){ P.sub.canceled = true; save('Подписка отменена — доступ до ' + dlong(P.sub.until)); render(); renderTop({title:'Профиль'}) }
});
render();
initShell({page:'profile.html', title:'Профиль'});
</script>
</body>
</html>
