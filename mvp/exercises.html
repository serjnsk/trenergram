<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>База упражнений · Тренерграм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base-trainer.css">
<link rel="stylesheet" href="assets/theme-01-strava.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page">
      <!-- Без боковой панели: клик по строке открывает страницу элемента -->
      <div class="cons one">
        <main><section class="pane" id="page"></section></main>
      </div>
    </div>
  </div>
</div>
<div class="ov" id="ov"></div>
<script src="assets/exdb.js"></script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/dd.js"></script>
<script src="assets/ui.js"></script>
<script>
/* ═══════════ БАЗА УПРАЖНЕНИЙ (EX-1, EX-2, EX-3) ═══════════
   Только список: клик по строке открывает страницу упражнения, там его
   смотрят и правят. «Добавить упражнение» — пустая страница своего. */
const V = { q:'', eq:'', own:false, g:'Все' };

function matchEX(e){
  if(V.g!=='Все' && e.g!==V.g) return false;
  if(V.eq && e.eq!==V.eq) return false;
  if(V.own && !e.own) return false;
  if(V.q){ const n=norm(V.q); if(norm(e.ru).indexOf(n)<0 && norm(e.en).indexOf(n)<0) return false; }
  return true;
}

/* Столбцы вместо карточек: в базе больше тысячи упражнений (датасет
   hasaneyldrm, OQ-9) — плитками это не просматривается.
   Показатели вынесены в отдельный столбец: по ним тренер и выбирает, чем
   мерить упражнение (EX-3). */
const EX_COLS = [
  {k:'ru', n:'Упражнение', sort:byStr('ru'), cell:e=>
    `<div class="cellname">
       <span class="thumb ${e.m==='pending'?'pending':''}" style="width:44px;height:44px;font-size:13px;border-radius:var(--rad-m)">${e.img?`<img src="${e.img}" alt="" loading="lazy">`:e.m==='pending'?'':initials(e)}</span>
       <div style="min-width:0">
         <div class="n">${esc(e.ru)}</div>
         <div class="sub">${esc(e.en)}</div>
       </div>
     </div>`},
  {k:'g',  n:'Группа',     w:'120px', sort:byStr('g'),  cell:e=>esc(e.g)},
  {k:'eq', n:'Оснащение',  w:'130px', sort:byStr('eq'), cell:e=>esc(e.eq)},
  {k:'u',  n:'Показатели', w:'190px', sort:byNum(e=>(e.u||[]).length), cell:e=>
    (e.u||[]).map(u=>`<span class="chip">${esc(u)}</span>`).join(' ')},
  {k:'pm', n:'ПМ', w:'90px', sort:byNum(e=>e.pm?0:1), cell:e=>
    e.pm ? `<span class="chip acc">${esc(PMNAMES[e.pm]||e.pm)}</span>` : '—'},
  {k:'own',n:'Источник', w:'110px', sort:byNum(e=>e.own?0:1), cell:e=>
    e.own ? `<span class="chip ok">своё</span>` : `<span class="chip ghost">общая</span>`},
];

function render(){
  const all = exLive(), list = all.filter(matchEX);
  $('#page').innerHTML = paneHead('Упражнения', all.length, `
      <label class="search" style="width:260px">${ICON.search}<input id="q" placeholder="Поиск упражнения…" value="${esc(V.q)}"></label>
      <select class="inp" id="g" style="width:190px">
        ${GROUPS.map(g=>`<option value="${esc(g)}" ${V.g===g?'selected':''}>${g==='Все'?'Все группы':esc(g)}</option>`).join('')}
      </select>
      <select class="inp" id="eq" style="width:205px">
        <option value="">Любое оснащение</option>
        ${EQUIP.map(x=>`<option ${V.eq===x?'selected':''}>${esc(x)}</option>`).join('')}
      </select>
      <label class="chk"><input type="checkbox" id="own" ${V.own?'checked':''}> Только свои</label>
      <span class="sp"></span>
      <a class="btn" id="btnAdd" href="exercise.html?new=1">${ICON.plus} Добавить упражнение</a>`)
    + (list.length ? dataTable('ex', EX_COLS, list) : `<div class="empty"><div class="t">Ничего не нашли</div><div class="d">Измените поиск или фильтр</div></div>`);
  bindTable('ex', render, id=>{ listSave('exercises.html', V); location.href = 'exercise.html?id=' + encodeURIComponent(id) });
  $('#g').onchange=e=>{ V.g=e.target.value; render() };
  $('#eq').onchange=e=>{ V.eq=e.target.value; render() };
  $('#own').onchange=e=>{ V.own=e.target.checked; render() };
  $('#q').oninput=e=>{ V.q=e.target.value; render() };
  $('#btnAdd').onclick=()=>listSave('exercises.html', V);
  const qEl=$('#q'); qEl.focus({preventScroll:true}); qEl.setSelectionRange(V.q.length,V.q.length);
}
const Y0 = listLoad('exercises.html', V);
render();
initShell({page:'exercises.html'});
listScroll(Y0);
</script>
</body>
</html>
