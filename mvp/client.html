<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточка клиента · Тренерграм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base-trainer.css">
<link rel="stylesheet" href="assets/theme-01-strava.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page"><div class="pagewrap wide">
        <div class="phead" id="pagehead"></div>
        <div id="page"></div>
      </div></div>
  </div>
</div>
<div class="ov" id="ov"></div>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/ui.js"></script>
<script>
/* ═══════════ КАРТОЧКА КЛИЕНТА ═══════════
   Шапка по паттерну CRM-профиля (Zoho/HubSpot): полоса идентификации (фото,
   имя, пол и возраст, действия) → сетка подписанных полей (телефон, Telegram,
   Max ссылками; с нами с; оплачено до; последняя активность — точка-статус) →
   заметка тренера строкой на всю ширину. Ниже липкие табы-якоря:
   Календарь (две недели) · События · Замеры (в динамике) · Максимумы (1ПМ/3ПМ
   с динамикой). Один экран без переходов. */
const CID = new URLSearchParams(location.search).get('id') || STATE.curClient || 'c1';
const C = client(CID) || CLIENTS[0];
STATE.curClient = C.id; saveState();
const V = { metric: Object.keys(C.hist||{})[0] || 'squat', meas:'w' };
const SECTIONS = [['cal','Календарь'],['events','События'],['meas','Замеры'],['pm','Максимумы']];
const MEAS = [['w','Вес','кг'],['waist','Талия','см'],['chest','Грудь','см'],['hips','Бёдра','см'],['fat','Жир','%']];
const pmLabel = k => PMNAMES[k] || (EX.find(e=>e.id===k)||{}).ru || k;
const CI = {
  phone:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 2.5h2.2l1 2.8-1.4 1a8 8 0 0 0 4.4 4.4l1-1.4 2.8 1v2.2a1 1 0 0 1-1.1 1A11.5 11.5 0 0 1 2.5 3.6a1 1 0 0 1 1-1.1z"/></svg>',
  tg:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M14 2.5 2 7.2l4.3 1.6L8 13l2.2-3 3.8-7.5z"/><path d="M6.3 8.8 14 2.5"/></svg>',
  max:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 13V3l5 6 5-6v10"/></svg>',
};
const dlong = iso => { const d = new Date(iso+'T00:00:00'); return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear() };
const dshort = iso => dm(iso)+'.'+iso.slice(0,4);
const paidKV = () => { if(!C.paidUntil) return '<span class="v"><i class="dot"></i>не внесена</span>'; const r = daysBetween(TODAY, C.paidUntil);
  return r < 0 ? `<span class="v rm"><i class="dot"></i>${dshort(C.paidUntil)} <s>· просрочена</s></span>` : `<span class="v ${r<=7?'warn':'ok'}"><i class="dot"></i>${dshort(C.paidUntil)} <s>· ещё ${r} ${plural(r,'день','дня','дней')}</s></span>` };
const actKV = () => !C.last ? '<span class="v"><i class="dot"></i>ещё не заходил</span>' : `<span class="v ${daysBetween(C.last,TODAY)>=3?'warn':'ok'}"><i class="dot"></i>${ago(C.last)}</span>`;

/* Две недели — текущая и следующая — теми же карточками, что в календаре. */
function laneHTML(){
  const P = C.prog ? program(C.prog) : null, plan = P ? buildPlan(C.prog) : [];
  const wk0 = addDays(TODAY, -dowMon(TODAY));
  return `<div class="days cal compact">${Array.from({length:14},(_,k)=>{ const date=addDays(wk0,k), dt=new Date(date+'T00:00:00'); const i = P ? daysBetween(P.start, date) : -1;
    const inProg = !!P && i>=0 && i<P.days, x = inProg && i<plan.length ? plan[i] : null; const n = x ? x.blocks.reduce((a,b)=>a+b.items.filter(y=>y.exId).length,0) : 0;
    const mon = (dt.getDate()===1 || k===0) ? ' '+MONTHS[dt.getMonth()].slice(0,3) : '';
    const head=`<span class="d">${RU[dowMon(date)]} ${dt.getDate()}${mon}${date===TODAY?'<i class="tdot" title="Сегодня"></i>':''}</span>`;
    const cls = date===TODAY ? ' today' : '';
    if(!inProg) return `<span class="day out${cls}">${head}<span class="e">${P?'вне программы':'нет программы'}</span></span>`;
    if(!x) return `<a class="day empty${cls}" href="constructor.html?client=${C.id}&date=${date}">${head}<span class="e">не составлено</span></a>`;
    return `<a class="day cmp${n?'':' rest'}${cls}" href="constructor.html?client=${C.id}&date=${date}">${head}${!n?'<span class="e">отдых</span>':x.draft?'<span class="dr">черновик</span>':`<span class="t">${esc(x.title||'Без названия')}</span>`}</a>`; }).join('')}</div>`;
}
/* Замеры в динамике: график по выбранному показателю и таблица по датам. */
function measHTML(){
  const rows = (C.meas||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const [k,name,unit] = MEAS.find(m=>m[0]===V.meas) || MEAS[0];
  const series = rows.filter(r=>r[k]!=null).map(r=>[r.date, r[k]]);
  const fmt = (kk, v) => v==null ? '—' : (kk==='w' || kk==='fat') ? v.toFixed(1).replace('.',',') : String(Math.round(v));
  /* Дельта — всегда в своей колонке фиксированной ширины, чтобы значения в столбце стояли ровно. */
  const delta = (i, kk) => { const cur = rows[i], prev = rows[i-1]; const d = (!cur || !prev || cur[kk]==null || prev[kk]==null) ? 0 : Math.round((cur[kk]-prev[kk])*10)/10;
    return `<i class="dl ${d<0?'dn':d>0?'up':''}">${d ? (d>0?'+':'')+String(d).replace('.',',') : ''}</i>` };
  return `<div class="card">
    <div class="mhead">
      <span class="mh"><s>Пол</s><b>${C.sex==='ж'?'Женский':'Мужской'}</b></span>
      <span class="mh"><s>Дата рождения</s><b>${dlong(C.born)} · ${age(C.born)} ${plural(age(C.born),'год','года','лет')}</b></span>
      <span class="mh"><s>Рост</s><b>${C.h?C.h+' см':'—'}</b></span>
      <span class="sp"></span>
      <button class="btn gh sm" id="addMeas">${ICON.plus} Добавить замер</button>
    </div>
    <div class="mbody">
      <div class="tblwrap"><table class="tbl ctbl mtbl"><thead><tr><th>Дата</th>${MEAS.map(([kk,n,u])=>`<th class="r">${n}<s>${u}</s></th>`).join('')}</tr></thead><tbody>
        ${rows.map((r,i)=>({r,i})).reverse().map(({r,i})=>`<tr><td>${humanDate(r.date)}</td>${MEAS.map(([kk])=>`<td class="r"><span class="mv"><b>${fmt(kk, r[kk])}</b>${delta(i,kk)}</span></td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="mchart">
        <div class="pmpick">${MEAS.map(([kk,n])=>`<button data-meas="${kk}" class="${V.meas===kk?'on':''}">${n}</button>`).join('')}</div>
        <div class="chartbox">${series.length>1 ? lineChart(series, unit) : '<div class="empty"><div class="t">Мало замеров для графика</div></div>'}</div>
      </div>
    </div>
  </div>`;
}
/* Максимумы: 1ПМ и 3ПМ — оба вносятся тренером или клиентом; 3ПМ по умолчанию
   пуст, пока его не зафиксировали. Динамика — графиком справа по выбранной строке. */
const pm3Of = cid => ((STATE.pm3 ||= {})[cid] ||= {});
function pmHTML(){
  const pm = pmOf(C.id), pm3 = pm3Of(C.id), hist = C.hist || {};
  const keys = Object.keys(pm);
  if(!keys.includes(V.metric)) V.metric = keys[0] || null;
  const lastAll = keys.map(k=>(hist[k]||[]).slice(-1)[0]?.[0]).filter(Boolean).sort().pop();
  const rowOf = k => { const h = hist[k] || []; const last = h.length ? h[h.length-1][0] : null;
    return `<tr class="click ${V.metric===k?'on':''}" data-pm-row="${k}">
      <td><b>${esc(pmLabel(k))}</b></td>
      <td class="r"><input class="pmin" data-pm="${k}" value="${fmtNum(pm[k])}"></td>
      <td class="r"><input class="pmin" data-pm3="${k}" value="${pm3[k]!=null?fmtNum(pm3[k]):''}" placeholder="—"></td>
      <td class="r mut">${last ? humanDate(last) : '—'}</td>
    </tr>`; };
  const series = V.metric && hist[V.metric] && hist[V.metric].length>1 ? hist[V.metric] : null;
  return `<div class="card">
    <div class="mhead">
      <span class="mh"><s>Упражнений</s><b>${keys.length}</b></span>
      <span class="mh"><s>Обновлён</s><b>${lastAll ? humanDate(lastAll) : '—'}</b></span>
      <span class="mh"><s>Проценты в тренировках</s><b>от 1ПМ</b></span>
      <span class="sp"></span>
      <button class="btn gh sm" id="addPm">${ICON.plus} Добавить упражнение</button>
    </div>
    <div class="mbody">
      <div class="tblwrap"><table class="tbl ctbl pmt" data-tbl="pm"><thead><tr><th>Упражнение</th><th class="r">1ПМ<s>кг</s></th><th class="r">3ПМ<s>кг</s></th><th class="r">Обновлён</th></tr></thead><tbody>
        ${keys.length ? keys.map(rowOf).join('') : '<tr><td colspan="4" class="mut">Максимумов пока нет — добавьте упражнение</td></tr>'}
      </tbody></table></div>
      <div class="mchart">
        <div class="pmpick">${keys.map(k=>`<button data-pm-pick="${k}" class="${V.metric===k?'on':''}">${esc(pmLabel(k))}</button>`).join('')}</div>
        <div class="chartbox">${series ? lineChart(series,'кг') : '<div class="empty"><div class="t">Истории пока нет</div><div class="d">Появится после второго зафиксированного максимума</div></div>'}</div>
      </div>
    </div>
  </div>`;
}

function render(){
  const P = C.prog ? program(C.prog) : null;
  $('#page').innerHTML = `
    <div class="chead">
      <div class="chead-top">
        <span class="cph">${esc(C.ini)}<button class="cph-up" title="Загрузить фото">${ICON.plus}</button></span>
        <div class="cid"><div class="nm">${esc(C.n)}</div><div class="sub">${C.sex==='ж'?'Женщина':'Мужчина'}, ${age(C.born)} ${plural(age(C.born),'год','года','лет')}</div></div>
        <div class="cacts">
          ${P ? `<a class="btn" href="constructor.html?client=${C.id}&date=${TODAY}">${ICON.build} В конструктор</a><a class="btn gh" href="calendar.html?client=${C.id}">Календарь</a>` : `<a class="btn" href="programs.html">${ICON.prog} Назначить программу</a>`}
        </div>
      </div>
      <div class="cgrid">
        <div class="cf"><span class="k">Телефон</span><a class="v" href="tel:${esc((C.phone||'').replace(/[^\d+]/g,''))}" title="Позвонить">${CI.phone}${esc(C.phone||'—')}</a></div>
        <div class="cf"><span class="k">Telegram</span><a class="v" href="https://t.me/${esc((C.tg||'').replace('@',''))}" target="_blank" rel="noopener" title="Написать в Telegram">${CI.tg}${esc(C.tg||'—')}</a></div>
        <div class="cf"><span class="k">Max</span><a class="v" href="#" title="Написать в Max" data-max>${CI.max}${esc(C.max||'—')}</a></div>
        <div class="cf"><span class="k">С нами с</span><span class="v">${dlong(C.since)}</span></div>
        <div class="cf"><span class="k">Оплачено до</span>${paidKV()}</div>
        <div class="cf"><span class="k">Последняя активность</span>${actKV()}</div>
      </div>
      <label class="cnote"><span class="k">${ICON.chat} Заметка тренера <i>· клиент не видит</i></span><input id="fNote" value="${esc(C.note||'')}" placeholder="Что важно помнить об этом клиенте…"></label>
    </div>

    <nav class="ctabs" id="ctabs">${SECTIONS.map(([k,n],i)=>`<a href="#${k}" class="${i===0?'on':''}" data-sec="${k}">${n}</a>`).join('')}</nav>

    <section class="csec" id="cal">
      <div class="sechead"><span class="t">Календарь</span><span class="ln"></span>${P?`<span class="n">${esc(P.title)} · составлено ${composedDays(C.prog)} из ${P.days}</span>`:''}<a class="lnk" href="calendar.html?client=${C.id}">весь календарь →</a></div>
      <div class="card cb">${laneHTML()}</div>
    </section>

    <section class="csec" id="events">
      <div class="sechead"><span class="t">Последние события</span><span class="ln"></span></div>
      <div class="card cb flush"><div class="feed1" style="margin:0">${feedHTML(events(C.id))}</div></div>
    </section>

    <section class="csec" id="meas">
      <div class="sechead"><span class="t">Замеры</span><span class="ln"></span></div>
      ${measHTML()}
    </section>

    <section class="csec" id="pm">
      <div class="sechead"><span class="t">Максимумы</span><span class="ln"></span></div>
      ${pmHTML()}
    </section>`;

  $$('[data-meas]').forEach(b=>b.onclick=()=>{ V.meas=b.dataset.meas; render() });
  $$('[data-pm-row]').forEach(r=>r.onclick=e=>{ if(e.target.closest('input')) return; V.metric=r.dataset.pmRow; render() });
  $$('[data-pm-pick]').forEach(b=>b.onclick=()=>{ V.metric=b.dataset.pmPick; render() });
  $$('[data-pm]').forEach(inp=>inp.onchange=()=>{ const v=parseFloat(inp.value.replace(',','.')); if(!isFinite(v)) return; pmOf(C.id)[inp.dataset.pm]=v; (C.hist[inp.dataset.pm] ||= []).push([TODAY, v]); saveState(); toast('1ПМ обновлён — проценты в тренировках пересчитаются'); render() });
  $$('[data-pm3]').forEach(inp=>inp.onchange=()=>{ const v=parseFloat(inp.value.replace(',','.')); pm3Of(C.id)[inp.dataset.pm3] = isFinite(v) ? v : null; saveState(); toast('3ПМ записан') });
  $('#fNote').onchange=e=>{ C.note=e.target.value; toast('Заметка сохранена') };
  const am = $('#addMeas'); if(am) am.onclick=()=>openModal({title:'Новый замер', body:`<div class="cols3">${MEAS.map(([k,n,u])=>`<div class="formfld"><span class="k">${n}, ${u}</span><input class="inp" data-nm="${k}" placeholder="—"></div>`).join('')}</div>`,
    foot:`<span class="sp"></span><button class="btn gh" data-close>Отмена</button><button class="btn" id="nmSave">Сохранить</button>`});
  const ap = $('#addPm'); if(ap) ap.onclick=()=>{ const pm = pmOf(C.id), seen = new Set(Object.keys(pm)), opts = [];
    EX.forEach(e=>{ if(!(e.u||[]).includes('кг')) return; const k = e.pm || e.id; if(seen.has(k)) return; seen.add(k); opts.push([k, PMNAMES[k] || e.ru]) });
    opts.sort((a,b)=>a[1].localeCompare(b[1],'ru'));
    openModal({title:'Новое упражнение в максимумах', body:`<div class="formfld"><span class="k">Упражнение</span><select class="inp" id="npKey">${opts.map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join('')}</select></div>
      <div class="cols2" style="margin-top:12px"><div class="formfld"><span class="k">1ПМ, кг</span><input class="inp" id="npV1" placeholder="—"></div><div class="formfld"><span class="k">3ПМ, кг · необязательно</span><input class="inp" id="npV3" placeholder="—"></div></div>`,
      foot:`<span class="sp"></span><button class="btn gh" data-close>Отмена</button><button class="btn" id="npSave">Добавить</button>`});
    $('#npV1').focus();
    $('#npSave').onclick=()=>{ const k = $('#npKey').value, v = parseFloat($('#npV1').value.replace(',','.')), v3 = parseFloat($('#npV3').value.replace(',','.'));
      if(!k || !isFinite(v)){ toast('Укажите 1ПМ'); return } pm[k]=v; ((C.hist ||= {})[k] ||= []).push([TODAY, v]); if(isFinite(v3)) pm3Of(C.id)[k]=v3;
      V.metric=k; saveState(); closeModal(); toast('Упражнение добавлено'); render() } };
  document.addEventListener('click', e=>{ if(e.target.closest('#nmSave')){ const r={date:TODAY}; $$('[data-nm]').forEach(i=>{ const v=parseFloat(i.value.replace(',','.')); if(isFinite(v)) r[i.dataset.nm]=v }); if(Object.keys(r).length>1){ (C.meas ||= []).push(r); if(r.w) C.w=r.w; closeModal(); toast('Замер записан'); render() } } }, {once:true});
  $$('.fev.t-q .btn').forEach(b=>b.onclick=e=>{ e.preventDefault(); location.href='#events'; toast('Ответ на вопрос — из ленты дашборда') });
  $$('.cph-up').forEach(b=>b.onclick=()=>toast('Загрузка фото появится с бэкендом — пока инициалы'));
  $$('[data-max]').forEach(a=>a.onclick=e=>{ e.preventDefault(); toast('Max: ссылка на чат появится, когда мессенджер откроет диплинки') });
  const HEAD = 58 + 52;
  $$('#ctabs a').forEach(a=>a.onclick=e=>{ e.preventDefault(); const el=$('#'+a.dataset.sec); window.scrollTo({top: el.getBoundingClientRect().top + scrollY - HEAD, behavior:'smooth'}); history.replaceState(null,'','#'+a.dataset.sec) });
  const io = new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ $$('#ctabs a').forEach(a=>a.classList.toggle('on', a.dataset.sec===en.target.id)) } }) }, {rootMargin:'-120px 0px -70% 0px'});
  $$('.csec').forEach(s=>io.observe(s));
}
render();
initShell({page:'clients.html'});
</script>

</body>
</html>
