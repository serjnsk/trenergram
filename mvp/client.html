<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточка клиента · Тренерграм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base-trainer.css">
<link rel="stylesheet" href="assets/theme-01-strava.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page"><div class="pagewrap wide">
        <div class="phead" id="pagehead"></div>
        <div id="page"></div>
      </div></div>
  </div>
</div>
<div class="ov" id="ov"></div>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/ui.js"></script>
<script>
/* ═══════════ КАРТОЧКА КЛИЕНТА ═══════════
   Шапка с фото и главными параметрами, под ней липкие табы-якоря по секциям:
   Обзор · Программа · Результаты · Максимумы · Показатели · Общение · Данные.
   Один экран без переходов: табы прокручивают к секции, активный подсвечивается. */
const CID = new URLSearchParams(location.search).get('id') || STATE.curClient || 'c1';
const C = client(CID) || CLIENTS[0];
STATE.curClient = C.id; saveState();
const V = { metric: Object.keys(C.hist||{})[0] || 'squat' };
const SECTIONS = [['overview','Обзор'],['program','Программа'],['results','Результаты'],['pm','Максимумы'],['body','Показатели'],['chat','Общение'],['info','Данные']];
const resultsFor = cid => LOG.filter(r=>r.cid===cid).sort((a,b)=> a.date<b.date?1:-1);
const pmLabel = k => PMNAMES[k] || k;
const runway = () => { if(!C.prog) return null; const n = composedDays(C.prog); return daysBetween(TODAY, dayDate(C.prog, Math.max(0,n-1))) };
const runwayChip = () => { const r = runway(); if(r===null) return '<span class="chip ghost">без программы</span>';
  if(r<0) return '<span class="chip rm">кончилась</span>'; if(r===0) return '<span class="chip warn">сегодня последняя</span>';
  return `<span class="chip ${r<=7?'warn':'ok'}">ещё ${r} ${plural(r,'день','дня','дней')}</span>` };

function render(){
  const P = C.prog ? program(C.prog) : null, pm = pmOf(C.id), res = resultsFor(C.id);
  const plan = P ? buildPlan(C.prog) : [], i0 = P ? daysBetween(P.start, TODAY) : -1;
  const unread = C.comments.filter((cm,i)=>!cm.reply && !STATE.replied[C.id+':'+i]).length;
  $('#page').innerHTML = `
    <div class="chead">
      <span class="cph">${esc(C.ini)}<button class="cph-up" title="Загрузить фото">${ICON.plus}</button></span>
      <div class="cinfo">
        <div class="nm">${esc(C.n)}</div>
        <div class="mt"><span class="chip">${esc(C.sport)}</span><span class="chip">${esc(C.level)}</span><span class="chip ghost">${age(C.born)} ${plural(age(C.born),'год','года','лет')}</span><span class="chip ghost">${C.sex==='ж'?'жен.':'муж.'}</span><span class="chip ghost">${esc(C.tariff)}</span></div>
        <div class="pl">${P ? `<b>${esc(P.title)}</b> · ${dm(P.start)} – ${dm(dayDate(C.prog, P.days-1))} · составлено ${composedDays(C.prog)} из ${P.days} ${runwayChip()}` : '<b>Программа не назначена</b> · клиент видит пустой календарь'}</div>
      </div>
      <div class="cstats">
        <div class="cst"><s>Тренировок</s><b>${C.plan?C.done+'<i>/'+C.plan+'</i>':'—'}</b></div>
        <div class="cst"><s>Серия</s><b>${C.streak||'—'}${C.streak?'<i> дн.</i>':''}</b></div>
        <div class="cst"><s>Активность</s><b>${C.last ? ago(C.last) : 'не заходил'}</b></div>
        <div class="cst"><s>Вопросы</s><b>${unread ? `<span class="chip acc">${unread}</span>` : '—'}</b></div>
      </div>
      <div class="cacts">
        ${P ? `<a class="btn" href="constructor.html?client=${C.id}&date=${TODAY}">${ICON.build} В конструктор</a><a class="btn gh" href="calendar.html?client=${C.id}">Календарь</a>` : `<a class="btn" href="programs.html">${ICON.prog} Назначить программу</a>`}
        <button class="btn gh" id="btnMsg">${ICON.chat} Написать</button>
      </div>
    </div>

    <nav class="ctabs" id="ctabs">${SECTIONS.map(([k,n],i)=>`<a href="#${k}" class="${i===0?'on':''}" data-sec="${k}">${n}</a>`).join('')}</nav>

    <section class="csec" id="overview">
      <div class="sechead"><span class="t">Обзор</span><span class="ln"></span></div>
      <div class="facts">
        <div class="fact"><div class="k">Возраст</div><div class="v">${age(C.born)} <small>лет</small></div></div>
        <div class="fact"><div class="k">В работе</div><div class="v" style="font-size:14px">${yearsSince(C.since)}</div></div>
        <div class="fact"><div class="k">Рост</div><div class="v">${C.h?C.h+' <small>см</small>':'—'}</div></div>
        <div class="fact"><div class="k">Вес</div><div class="v">${C.w?fmtNum(C.w)+' <small>кг</small>':'—'}</div></div>
        <div class="fact"><div class="k">Присед</div><div class="v">${pm.squat?fmtNum(pm.squat)+' <small>кг</small>':'—'}</div></div>
        <div class="fact"><div class="k">Становая</div><div class="v">${pm.dead?fmtNum(pm.dead)+' <small>кг</small>':'—'}</div></div>
        <div class="fact"><div class="k">Жим лёжа</div><div class="v">${pm.bench?fmtNum(pm.bench)+' <small>кг</small>':'—'}</div></div>
      </div>
    </section>

    <section class="csec" id="program">
      <div class="sechead"><span class="t">Программа</span><span class="ln"></span>${P?`<a class="lnk" href="calendar.html?client=${C.id}">весь календарь →</a>`:''}</div>
      <div class="card cb">
        ${P ? `<div class="pgrow"><div><b>${esc(P.title)}</b><s>${esc(P.goal||'')}</s></div><div class="pgm"><s>Сроки</s><b>${dm(P.start)} – ${dm(dayDate(C.prog, P.days-1))}</b></div><div class="pgm"><s>Составлено</s><b>${composedDays(C.prog)} из ${P.days} дней</b></div><div class="pgm"><s>Запас</s><b>${runwayChip()}</b></div></div>
        <div class="days cal compact" style="margin-top:12px">${Array.from({length:7},(_,k)=>{ const i=i0+k; const date=addDays(TODAY,k); const inProg=i>=0 && i<P.days; const x=inProg && i<plan.length ? plan[i] : null; const n=x?x.blocks.reduce((a,b)=>a+b.items.filter(y=>y.exId).length,0):0;
          const head=`<span class="d">${RU[dowMon(date)]} ${new Date(date+'T00:00:00').getDate()}${k===0?'<i class="tdot"></i>':''}</span>`;
          if(!inProg) return `<span class="day out">${head}<span class="e">вне программы</span></span>`;
          if(!x) return `<a class="day empty" href="constructor.html?client=${C.id}&date=${date}">${head}<span class="e">не составлено</span></a>`;
          return `<a class="day cmp${n?'':' rest'}" href="constructor.html?client=${C.id}&date=${date}">${head}${!n?'<span class="e">отдых</span>':x.draft?'<span class="dr">черновик</span>':`<span class="t">${esc(x.title||'Без названия')}</span>`}</a>`; }).join('')}</div>`
        : `<div class="empty"><div class="t">Программа не назначена</div><div class="d">Назначьте из базы программ или соберите в конструкторе</div></div>`}
      </div>
    </section>

    <section class="csec" id="results">
      <div class="sechead"><span class="t">Результаты</span><span class="ln"></span></div>
      <div class="cols2" style="grid-template-columns:1.2fr 1fr;align-items:start">
        <div class="card">
          <div class="cb" style="padding-bottom:6px"><div class="pmpick">${Object.keys(C.hist||{}).map(k=>`<button data-m="${k}" class="${V.metric===k?'on':''}">${esc(pmLabel(k))}</button>`).join('') || '<span style="font-size:12px;color:var(--tx4)">Истории пока нет</span>'}</div></div>
          <div class="cb chartbox" style="padding-top:0">${C.hist && C.hist[V.metric] ? lineChart(C.hist[V.metric], 'кг') : ''}</div>
        </div>
        <div class="card cb flush">
          ${res.length ? `<div class="feed">${res.map(r=>{ const e=byId(r.exId);
            return `<div class="fitem"><span class="av s">${e?initials(e):'—'}</span><div class="c">
              <div class="h"><b>${e?esc(e.ru):esc(r.exId)}</b><span style="font-size:11.5px;color:var(--tx4)">· ${esc(r.scheme)}</span><time>${humanDate(r.date)}</time></div>
              <div class="tx">${r.kg!=null?`Рабочий вес ${fmtNum(r.kg)} кг`:''}${r.done?`Сделано: ${esc(r.done)}`:''}</div></div></div>`; }).join('')}</div>`
          : `<div class="empty"><div class="t">Записанных результатов пока нет</div><div class="d">Появятся, когда клиент отметит тренировку</div></div>`}
        </div>
      </div>
    </section>

    <section class="csec" id="pm">
      <div class="sechead"><span class="t">Максимумы</span><span class="ln"></span></div>
      <div class="card cb">
        ${Object.keys(pm).length ? `<div class="pmwrap">${Object.entries(pm).map(([k,v])=>`<div class="pmgrid"><span class="pn">${esc(pmLabel(k))}</span><input class="pmin" data-pm="${k}" value="${fmtNum(v)}"></div>`).join('')}</div>
        <div class="hint">Проценты в назначенных тренировках пересчитываются от этих значений автоматически.</div>` : '<div style="font-size:12.5px;color:var(--tx4)">Клиент ещё не указал ни одного максимума</div>'}
      </div>
    </section>

    <section class="csec" id="body">
      <div class="sechead"><span class="t">Показатели</span><span class="ln"></span></div>
      <div class="card cb">
        <div class="cols4">
          <div class="formfld"><span class="k">Рост, см</span><input class="inp" id="fH" value="${C.h||''}"></div>
          <div class="formfld"><span class="k">Вес, кг</span><input class="inp" id="fW" value="${C.w||''}"></div>
          <div class="formfld"><span class="k">Талия, см</span><input class="inp" placeholder="—"></div>
          <div class="formfld"><span class="k">Жир, %</span><input class="inp" placeholder="—"></div>
        </div>
        <div class="hint">Произвольные измерения (PRO-2) — добавляются по названию; здесь показаны четыре типовых.</div>
      </div>
    </section>

    <section class="csec" id="chat">
      <div class="sechead"><span class="t">Общение</span><span class="ln"></span>${unread?`<span class="n">${unread} без ответа</span>`:''}</div>
      <div class="card cb flush">
        ${C.comments.length ? `<div class="feed">${C.comments.map((cm,i)=>{ const key=C.id+':'+i;
          return `<div class="fitem"><span class="av s">${esc(C.ini)}</span><div class="c">
            <div class="h"><b>${esc(C.n)}</b>${cm.ex?`<span style="font-size:11.5px;color:var(--tx4)">· ${esc(cm.ex)}</span>`:''}<time>${humanDate(cm.d)}</time></div>
            <div class="tx">${esc(cm.tx)}</div>
            ${cm.reply?`<div class="tx" style="margin-top:8px;color:var(--tx1)"><b>Вы:</b> ${esc(cm.reply)}</div>`
              : `<div class="reply"><input placeholder="Ответить…" data-key="${key}"><button class="btn gh sm" data-send="${key}" data-i="${i}">Отправить</button></div>`}
          </div></div>`; }).join('')}</div>` : `<div class="empty"><div class="t">Сообщений ещё нет</div><div class="d">Вопросы клиента к тренировкам появятся здесь</div></div>`}
      </div>
    </section>

    <section class="csec" id="info">
      <div class="sechead"><span class="t">Данные</span><span class="ln"></span></div>
      <div class="card cb">
        <div class="cols4">
          <div class="formfld"><span class="k">Телефон</span><input class="inp" value="${esc(C.phone||'')}"></div>
          <div class="formfld"><span class="k">Дата рождения</span><input class="inp" type="date" value="${C.born||''}"></div>
          <div class="formfld"><span class="k">С нами с</span><input class="inp" type="date" value="${C.since||''}"></div>
          <div class="formfld"><span class="k">Тариф</span><input class="inp" value="${esc(C.tariff||'')}"></div>
        </div>
        <div class="formfld" style="margin-top:12px"><span class="k">Заметка тренера — клиент не видит</span><textarea class="inp" id="fNote" rows="3" style="height:auto;padding:9px 11px;resize:vertical">${esc(C.note||'')}</textarea></div>
      </div>
    </section>`;

  $$('.pmpick button').forEach(b=>b.onclick=()=>{ V.metric=b.dataset.m; render() });
  $$('[data-pm]').forEach(inp=>inp.onchange=()=>{ const v=parseFloat(inp.value.replace(',','.')); if(!isFinite(v)) return; pmOf(C.id)[inp.dataset.pm]=v; saveState(); toast('Максимум обновлён — проценты в тренировках пересчитаются') });
  $$('[data-send]').forEach(b=>b.onclick=()=>{ const key=b.dataset.send, i=+b.dataset.i; const v=$(`[data-key="${key}"]`).value.trim(); if(!v) return; C.comments[i].reply=v; STATE.replied[key]=true; saveState(); toast('Ответ отправлен'); render() });
  $('#fH').onchange=e=>{ C.h=+e.target.value||null; toast('Рост обновлён') };
  $('#fW').onchange=e=>{ C.w=+e.target.value||null; toast('Вес обновлён') };
  $('#fNote').onchange=e=>{ C.note=e.target.value; toast('Заметка сохранена') };
  $('#btnMsg').onclick=()=>toast('Сообщение клиенту — в клиентском приложении, появится с модулем общения');
  $$('.cph-up').forEach(b=>b.onclick=()=>toast('Загрузка фото появится с бэкендом — пока инициалы'));
  /* Табы-якоря: плавная прокрутка с учётом липких шапок; активный — по видимой секции. */
  const HEAD = 58 + 52;
  $$('#ctabs a').forEach(a=>a.onclick=e=>{ e.preventDefault(); const el=$('#'+a.dataset.sec); window.scrollTo({top: el.getBoundingClientRect().top + scrollY - HEAD, behavior:'smooth'}); history.replaceState(null,'','#'+a.dataset.sec) });
  const io = new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ $$('#ctabs a').forEach(a=>a.classList.toggle('on', a.dataset.sec===en.target.id)) } }) }, {rootMargin:'-120px 0px -70% 0px'});
  $$('.csec').forEach(s=>io.observe(s));
}
render();
initShell({page:'clients.html'});
</script>
</body>
</html>
