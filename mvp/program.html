<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Программа · Тренерграм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base-trainer.css">
<link rel="stylesheet" href="assets/theme-01-strava.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page"><div class="pagewrap wide"><div id="page"></div></div></div>
  </div>
</div>
<div class="ov" id="ov"></div>
<script src="assets/exdb.js"></script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/dd.js"></script>
<script src="assets/ui.js"></script>
<script>
/* ═══════════ СТРАНИЦА ПРОГРАММЫ (TPL-2) ═══════════
   Программа — цикл дней (тренировка из базы или отдых), который повторяется,
   пока не кончится срок. Недели в модели нет: ритм задаёт тренер, длина цикла
   любая. Своя правится здесь и сохраняется сама; общая из базы сервиса только
   смотрится — «Сохранить как своё» делает копию. Новая — та же страница
   пустой: в базе она появляется с первой правкой. */
const Q = new URLSearchParams(location.search);
let P = Q.get('new') ? null : tplById(Q.get('id'));
if(P && (P.del || P.lvl !== 'программа')) P = null;
const DRAFT = {lvl:'программа', title:'', goal:'', days:28, seq:[]};
const isNew = () => !P && !!Q.get('new');
const WO = () => tplLive('тренировка');
/* Тренировка из цикла, которую уже убрали из базы, остаётся выбранной — подписываем её как есть. */
const woOpts = cur => [...WO(), ...(cur && !WO().some(w => w.id === cur) && tplById(cur) ? [tplById(cur)] : [])];

function save(patch, msg){
  if(!P){
    P = {...DRAFT, ...patch, id:freshId('u'), own:true, at:TODAY, used:0};
    if(!P.title) P.title = 'Новая программа';
    tplPut(P);
    history.replaceState(null, '', 'program.html?id=' + P.id);
    toast('Программа добавлена в вашу базу');
  } else { Object.assign(P, patch); tplPut(P); if(msg !== false) toast(msg || 'Сохранено') }
  later();
}

/* Поле сохраняется при уходе из него: change приходит раньше, чем курсор
   переедет в следующее поле, — перерисовываем после переезда и возвращаем его. */
const later = () => setTimeout(render, 0);
function render(){
  const a = document.activeElement, fk = a && (a.dataset.f ? `[data-f="${a.dataset.f}"]` : null);
  draw();
  const back = fk && $(fk); if(back && back !== document.activeElement) back.focus({preventScroll:true});
}
function draw(){
  if(!P && !isNew()){
    setTopTitle('Программа');
    $('#page').innerHTML = `<div class="empty"><div class="t">Программы нет в базе</div><div class="d"><a href="programs.html">Вернуться к программам</a></div></div>`;
    return;
  }
  const x = P || DRAFT, own = !P || P.own, seq = x.seq || [];
  const nw = seq.filter(Boolean).length, cyc = seq.length;
  const exN = seq.reduce((n, id) => { const w = id && tplById(id); return n + (w ? tplStats(w).n : 0) }, 0);
  setTopTitle(isNew() ? 'Новая программа' : 'Программа');

  const row = (id, k) => {
    const w = id && tplById(id), st = w ? tplStats(w) : null;
    const meta = w ? `${st.blocks} ${plural(st.blocks,'блок','блока','блоков')} · ${st.n} упр.` : '';
    return own
      ? `<div class="cyc ${id ? '' : 'rest'}" draggable="true" data-k="${k}">
          <span class="gr" title="Перетащить день">${ICON.grip || '⋮⋮'}</span>
          <span class="cn">День ${k + 1}</span>
          <select class="inp" data-seq="${k}">
            <option value="" ${id ? '' : 'selected'}>Отдых</option>
            ${woOpts(id).map(t => `<option value="${t.id}" ${t.id === id ? 'selected' : ''}${t.own ? '' : ' data-sub="общая база"'}>${esc(t.title)}</option>`).join('')}
          </select>
          <span class="cmeta">${meta}</span>
          ${w ? `<a class="lnk" href="${elHref(w)}">открыть</a>` : '<span class="lnk"></span>'}
          <button class="iact" data-delday="${k}" title="Убрать день из цикла">✕</button>
        </div>`
      : `<div class="cyc ro ${id ? '' : 'rest'}">
          <span class="cn">День ${k + 1}</span>
          ${w ? `<a class="cw" href="${elHref(w)}">${esc(w.title)}</a>` : '<span class="cw">Отдых</span>'}
          <span class="cmeta">${meta}</span>
        </div>`;
  };

  $('#page').innerHTML = `
  <div class="ehead">
    <nav class="crumb"><a href="programs.html">Программы</a><span class="sep">/</span><span class="cur">${esc(x.title || 'Новая программа')}</span></nav>
    <div class="ehead-top">
      <span class="thumb eth">${ICON.prog}</span>
      <div class="eid">
        ${own ? `<input class="enm" data-f="title" value="${esc(x.title)}" placeholder="Название программы" aria-label="Название программы">` : `<div class="enm">${esc(x.title)}</div>`}
        <div class="esub">${own ? '<span class="chip ok">своё</span>' : '<span class="chip ghost">общая база</span>'}<span>${x.days} ${plural(x.days,'день','дня','дней')}</span><span>цикл ${cyc} ${plural(cyc,'день','дня','дней')}</span><span>${nw} ${plural(nw,'тренировка','тренировки','тренировок')} в цикле</span></div>
      </div>
      <div class="eacts">
        ${P && own ? `<button class="btn gh" id="pDup">${ICON.copy || ''} Дублировать</button><button class="btn gh" id="pDel">Удалить</button>` : ''}
        ${P && !own ? `<button class="btn" id="pOwn">Сохранить как своё</button>` : ''}
      </div>
    </div>
  </div>
  ${own ? '' : `<div class="ebar"><span><b>Программа из общей базы</b><s>Правится только своё (TPL-2). Нажмите «Сохранить как своё» — появится ваша копия, её и правьте.</s></span></div>`}
  ${isNew() ? `<div class="ebar"><span><b>Новая программа</b><s>Появится в вашей базе с первой правкой. Всё сохраняется само.</s></span></div>` : ''}

  <div class="egrid">
    <div>
      <div class="sechead"><span class="t">Основное</span><span class="ln"></span></div>
      <div class="card cb ecard">
        ${own ? `<div class="formfld" style="margin-bottom:12px"><span class="k">Цель</span><textarea class="inp" data-f="goal" rows="2" placeholder="Чего добиваемся за программу">${esc(x.goal || '')}</textarea></div>
          <div class="formfld" style="max-width:220px"><span class="k">Длительность, дней</span><input class="inp" data-f="days" type="number" min="1" max="365" value="${x.days}"></div>`
          : `<div class="kv" style="margin-top:0"><s>Цель</s><b>${esc(x.goal || '—')}</b><s>Длительность</s><b>${x.days} ${plural(x.days,'день','дня','дней')}</b></div>`}
      </div>

      <div class="sechead"><span class="t">Цикл</span><span class="ln"></span><span class="n">${cyc ? `повторяется до ${x.days}-го дня` : ''}</span></div>
      <div class="card cb ecard">
        ${cyc ? `<div class="cycs" id="cycs">${seq.map(row).join('')}</div>` : `<div class="hint" style="margin-top:0">В цикле пока нет дней. Добавьте тренировку или день отдыха.</div>`}
        ${own ? `<div class="cycadd"><button class="btn gh sm" id="addWo">${ICON.plus} Тренировка</button><button class="btn gh sm" id="addRest">${ICON.plus} Отдых</button></div>` : ''}
        <div class="hint">Цикл — дни подряд: тренировка из базы или отдых. Кончился цикл — начинается заново, пока не выйдет срок программы.</div>
      </div>
    </div>

    <div class="side">
      <div class="card cb ecard">
        <div class="kv" style="margin-top:0">
          <s>Источник</s><b>${own ? 'ваша база' : 'общая база сервиса'}</b>
          ${P ? `<s>Использована</s><b>${P.used ? P.used + '×' : '—'}</b>` : ''}
          ${x.at ? `<s>Создана</s><b>${new Date(x.at + 'T00:00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'})}</b>` : ''}
          <s>Тренировок в цикле</s><b>${nw}</b>
          <s>Упражнений за цикл</s><b>${exN}</b>
        </div>
      </div>
    </div>
  </div>`;
  bind();
}

function bind(){
  const x = P || DRAFT;
  $$('[data-f]').forEach(i => i.onchange = () => {
    const k = i.dataset.f; let v = i.value.trim();
    if(k === 'days'){ v = Math.max(1, Math.min(365, parseInt(v, 10) || x.days)) }
    if(k === 'title' && !v) return later();               /* без названия программа в базе не живёт */
    save({[k]: v});
  });
  $$('[data-seq]').forEach(s => s.onchange = () => { const seq = [...x.seq]; seq[+s.dataset.seq] = s.value || null; save({seq}) });
  $$('[data-delday]').forEach(b => b.onclick = () => { const seq = x.seq.filter((_, k) => k !== +b.dataset.delday); save({seq}, false) });
  const aw = $('#addWo'); if(aw) aw.onclick = () => save({seq:[...x.seq, (WO()[0] || {}).id || null]}, false);
  const ar = $('#addRest'); if(ar) ar.onclick = () => save({seq:[...x.seq, null]}, false);
  const dup = $('#pDup'); if(dup) dup.onclick = () => { const c = tplClone(P, P.title + ' — копия'); location.href = 'program.html?id=' + c.id };
  const own = $('#pOwn'); if(own) own.onclick = () => { const c = tplClone(P); location.href = 'program.html?id=' + c.id };
  const del = $('#pDel'); if(del) del.onclick = () => openModal({title:'Удалить программу', body:`<p class="lead">«${esc(P.title)}» уйдёт из вашей базы. Клиентам, которым она уже стоит в календаре, ничего не изменится.</p>`,
    foot:`<span class="sp"></span><button class="btn gh" data-close>Отмена</button><button class="btn rm" id="pDelOk">Удалить</button>`});
  /* Перетаскивание дней цикла — порядок и есть ритм программы. */
  let from = null;
  $$('#cycs .cyc[draggable]').forEach(r => {
    r.ondragstart = e => { from = +r.dataset.k; r.classList.add('drag'); e.dataTransfer.effectAllowed = 'move' };
    r.ondragend = () => { from = null; $$('#cycs .cyc').forEach(z => z.classList.remove('drag', 'over')) };
    r.ondragover = e => { if(from == null) return; e.preventDefault(); $$('#cycs .cyc').forEach(z => z.classList.toggle('over', z === r)) };
    r.ondrop = e => { e.preventDefault(); const to = +r.dataset.k; if(from == null || from === to) return;
      const seq = [...x.seq]; const [m] = seq.splice(from, 1); seq.splice(to, 0, m); save({seq}, false) };
  });
}
document.addEventListener('click', e => {
  if(e.target.closest('#pDelOk')){ tplDrop(P); location.href = 'programs.html' }
});
render();
initShell({page:'programs.html'});
</script>
</body>
</html>
