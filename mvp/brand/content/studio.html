<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Студия · Тренерграм</title>
<link rel="icon" href="../logo/trenergram-mark.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Студия — локальный просмотр роликов. Запуск: npm run studio (см. studio.mjs).
   Тёмный нейтральный фон, чтобы честно видеть цвета ролика; акцент — оранжевый бренда. */
:root{
  --bg:#0f0f10; --p1:#161618; --p2:#1d1d20; --p3:#26262a; --line:#2a2a2e;
  --tx:#f1f1f2; --tx2:#a1a1a8; --tx3:#6d6d74; --acc:#FC5200; --acc-a:rgba(252,82,0,.14);
  --ok:#2fbf71; --warn:#e8a33a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:500 13px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg{display:block}
.app{display:grid;grid-template-columns:360px 1fr 330px;grid-template-rows:56px 1fr;height:100%}

/* шапка */
header{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--p1)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;min-width:328px}
.brand img{height:22px}
.brand span{color:var(--tx2);font-weight:500}
.seg{display:flex;background:var(--p2);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:7px;color:var(--tx2);font-weight:600;white-space:nowrap}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--p3);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.grp{display:flex;align-items:center;gap:8px}
.grp>label{color:var(--tx3);font-size:12px;font-weight:600}
.sp{flex:1}
.tog{display:flex;align-items:center;gap:7px;color:var(--tx2);font-weight:600;cursor:pointer;user-select:none}
.tog i{width:30px;height:18px;border-radius:9px;background:var(--p3);position:relative;transition:.15s}
.tog i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#bdbdc3;transition:.15s}
.tog.on{color:var(--tx)} .tog.on i{background:var(--acc)} .tog.on i:after{left:14px;background:#fff}

/* колонки */
aside{background:var(--p1);display:flex;flex-direction:column;min-height:0}
aside.l{border-right:1px solid var(--line)}
aside.r{border-left:1px solid var(--line)}
.ah{padding:14px 16px 10px;display:flex;align-items:center;gap:8px}
.ah h2{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);font-weight:700}
.ah .n{color:var(--tx3);font-weight:600}
.search{margin:0 16px 10px;position:relative}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--p2);padding:0 10px 0 32px;outline:0}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:10px;top:9px;color:var(--tx3)}
.list{flex:1;overflow:auto;padding:0 8px 16px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--p3);border-radius:4px}
.fold{padding:12px 8px 6px;color:var(--tx3);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.vi{display:flex;gap:12px;padding:8px;border-radius:10px;cursor:pointer;align-items:center;width:100%;text-align:left}
.vi:hover{background:var(--p2)}
.vi.on{background:var(--acc-a);box-shadow:inset 0 0 0 1px rgba(252,82,0,.45)}
.th{width:48px;height:72px;border-radius:6px;background:var(--p3) center/cover no-repeat;flex:none;position:relative;overflow:hidden}
.th.wide{height:48px}
.th b{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.72);border-radius:4px;padding:1px 4px;font-size:10px;font-weight:600}
.vm{min-width:0;flex:1}
.vm .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vm .s{color:var(--tx2);font-size:12px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.vm .d{color:var(--tx3);font-size:11.5px;margin-top:2px}
.badge{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--p3);color:var(--tx2);font-size:11px;font-weight:700}
.new{background:var(--acc);color:#fff}
.empty{padding:24px 16px;color:var(--tx2);line-height:1.6}
.empty code{background:var(--p2);padding:2px 6px;border-radius:5px;color:var(--tx)}

/* центр: телефон и плеер */
main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.stagebox{flex:1;position:relative;min-height:0}
.fit{position:absolute;left:50%;top:50%;transform-origin:center}
.device{position:relative;background:#050506;box-shadow:0 0 0 1.5px #3a3a40, 0 0 0 5px #121214, 0 30px 80px rgba(0,0,0,.6)}
.screen{position:absolute;overflow:hidden;background:#000}
.area{position:absolute;left:0;right:0;top:0;overflow:hidden;background:#000}
.area video{position:absolute;left:0;top:0;transform-origin:0 0}
.island{position:absolute;left:50%;transform:translateX(-50%);background:#000;border-radius:20px;z-index:5}
.punch{position:absolute;left:50%;transform:translateX(-50%);background:#000;border-radius:50%;z-index:5}
.homebtn{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;border:2px solid #2c2c31}
.sbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#fff;font:600 16px/1 Inter;z-index:4;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.25)}
.sbar .ic{display:flex;gap:6px;align-items:center}
.homeind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fff;z-index:6;pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:none;z-index:3;color:#fff}
.guide{position:absolute;border:1.5px dashed rgba(64,220,255,.95);background:rgba(64,220,255,.06);z-index:2;pointer-events:none}
.guide span{position:absolute;left:4px;top:-18px;font:600 10px/1 Inter;color:#40dcff;white-space:nowrap}
.raw{background:none;box-shadow:none}
.raw .screen{border-radius:6px!important;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.5)}
.nothing{position:absolute;inset:0;display:grid;place-items:center;color:var(--tx3);text-align:center;line-height:1.6;padding:24px}

.player{flex:none;padding:10px 24px 18px;display:flex;flex-direction:column;gap:8px;align-items:center}
.scrub{width:min(620px,100%);height:18px;position:relative;cursor:pointer;display:flex;align-items:center}
.scrub .tr{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--p3)}
.scrub .bf{position:absolute;left:0;height:4px;border-radius:2px;background:var(--acc)}
.scrub .kn{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;margin-left:-6px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.ctrl{width:min(620px,100%);display:flex;align-items:center;gap:6px}
.ctrl .ib{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--tx2)}
.ctrl .ib:hover{background:var(--p2);color:var(--tx)}
.ctrl .ib.on{color:var(--acc)}
.ctrl .play{width:42px;height:42px;border-radius:50%;background:var(--tx);color:#000;display:grid;place-items:center}
.ctrl .play:hover{background:#fff}
.time{font:600 13px/1 Inter;font-variant-numeric:tabular-nums;color:var(--tx2);min-width:150px}
.time b{color:var(--tx)}
.ctrl .seg button{padding:5px 9px}
.keys{color:var(--tx3);font-size:11.5px}
.keys kbd{font:600 10.5px Inter;background:var(--p2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--tx2)}

/* справа: сцены и сведения */
.sc{padding:10px 8px 10px 12px;margin:0 8px;border-radius:10px;display:flex;gap:10px;align-items:center}
.sc:hover{background:var(--p2)}
.sc .vm .t{font-size:13px}
.st{font-size:11.5px;font-weight:600}
.st.ok{color:var(--ok)} .st.old{color:var(--warn)} .st.no{color:var(--tx3)}
.btn{height:30px;padding:0 11px;border-radius:7px;background:var(--p3);font-weight:600;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--tx)}
.btn:hover{background:#303036}
.btn.pri{background:var(--acc);color:#fff}
.btn.pri:hover{background:#ff6418}
.btn[disabled]{opacity:.45;pointer-events:none}
.prog{height:3px;border-radius:2px;background:var(--p3);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.info{border-top:1px solid var(--line);padding:14px 16px 18px}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 14px}
.info dt{color:var(--tx3)} .info dd{margin:0;word-break:break-all}
.info .warn{color:var(--warn);font-size:12px;margin:-4px 0 12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 16px;border-radius:9px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
.offline{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;line-height:1.7;color:var(--tx2);z-index:60;padding:24px}
.offline h1{color:var(--tx);font-size:22px;margin:0 0 8px}
.offline code{background:var(--p2);padding:3px 8px;border-radius:6px;color:var(--tx)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img src="../logo/trenergram-logo-on-dark.svg" alt="Тренерграм"><span>Студия</span></div>
    <div class="grp"><label>Устройство</label><div class="seg" id="devSeg"></div></div>
    <div class="grp"><label>Площадка</label><div class="seg" id="ovSeg"></div></div>
    <div class="sp"></div>
    <div class="tog" id="tGuide" title="Безопасная зона площадки — титры и важное держать внутри (G)"><i></i>Безопасная зона</div>
    <div class="tog" id="tFill" title="Вертикальное видео на вытянутом экране площадки обрезают по бокам (F)"><i></i>Обрезать как в ленте</div>
  </header>

  <aside class="l">
    <div class="ah"><h2>Видео</h2><span class="n" id="vCount"></span></div>
    <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Поиск по названию и папке"></div>
    <div class="list" id="vList"></div>
  </aside>

  <main>
    <div class="stagebox" id="stagebox"><div class="fit" id="fit"></div></div>
    <div class="player">
      <div class="scrub" id="scrub"><div class="tr"></div><div class="bf" id="bf"></div><div class="kn" id="kn"></div></div>
      <div class="ctrl">
        <button class="ib" id="bPrevF" title="Кадр назад (←)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14l-10-7z"/></svg></button>
        <button class="play" id="bPlay" title="Пуск / пауза (пробел)"></button>
        <button class="ib" id="bNextF" title="Кадр вперёд (→)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10-7z"/></svg></button>
        <div class="time" id="time"><b>0:00.0</b> / 0:00.0</div>
        <div class="sp"></div>
        <div class="seg" id="spdSeg"></div>
        <button class="ib" id="bLoop" title="Повтор (L)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
        <button class="ib" id="bMute" title="Звук (M)"></button>
      </div>
      <div class="keys"><kbd>Пробел</kbd> пуск · <kbd>←</kbd><kbd>→</kbd> кадр · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> секунда · <kbd>↑</kbd><kbd>↓</kbd> соседнее видео · <kbd>1</kbd>–<kbd>5</kbd> устройство</div>
    </div>
  </main>

  <aside class="r">
    <div class="ah"><h2>Сцены</h2><span class="n" id="sCount"></span><div class="sp"></div><button class="btn" id="bRenderStale" title="Отрендерить все устаревшие и новые сцены">Все устаревшие</button></div>
    <div class="list" id="sList" style="padding:0 0 12px"></div>
    <div class="info" id="info"></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<div class="offline" id="offline"><div><h1>Студия работает только локально</h1>Запустите на своём компьютере в папке <code>mvp/brand/content</code>:<br><code>npm run studio</code></div></div>

<script>
// ───── устройства: размеры экрана в точках CSS, рамка, вырез ─────
const DEVICES = {
  se:    { name: 'iPhone SE',      w: 375, h: 667, r: 0,  bz: [16, 100], cut: 'home', sb: 20,  home: false },
  i15:   { name: 'iPhone 15',      w: 393, h: 852, r: 55, bz: [14, 14],  cut: 'island', sb: 54, home: true },
  pm:    { name: 'iPhone 15 Pro Max', w: 430, h: 932, r: 55, bz: [14, 14], cut: 'island', sb: 54, home: true },
  pixel: { name: 'Pixel 8',        w: 412, h: 915, r: 34, bz: [12, 12],  cut: 'punch', sb: 40,  home: false },
  raw:   { name: 'Без рамки' },
};
// ───── площадки: нижняя панель навигации и безопасная зона (в пикселях кадра 1080×1920, ориентир) ─────
const PLATFORMS = {
  none:   { name: 'Нет' },
  reels:  { name: 'Reels',  nav: 50, safe: { t: 220, b: 450, l: 60, r: 130 } },
  tiktok: { name: 'TikTok', nav: 50, safe: { t: 130, b: 370, l: 60, r: 130 } },
  shorts: { name: 'Shorts', nav: 50, safe: { t: 160, b: 380, l: 60, r: 140 } },
};
const SPEEDS = [0.25, 0.5, 1, 2];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('studio.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('studio.' + k, JSON.stringify(v)); } catch (e) {} } };

const st = {
  videos: [], scenes: [], queue: { current: null, waiting: [] },
  sel: store.get('sel', null), dev: store.get('dev', 'i15'), plat: store.get('plat', 'reels'),
  guide: store.get('guide', false), fill: store.get('fill', true), loop: store.get('loop', true),
  speed: 1, muted: store.get('muted', false), q: '', seen: new Set(store.get('seen', [])), autoSelect: null,
};
const video = document.createElement('video');
video.playsInline = true; video.preload = 'auto';

// ───── форматирование ─────
const fmtT = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(1).padStart(4, '0')}`; };
const fmtDur = t => { t = Math.round(t || 0); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
const fmtSize = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' ГБ' : b > 1e6 ? (b / 1e6).toFixed(1) + ' МБ' : Math.round(b / 1e3) + ' КБ';
const ratio = (w, h) => { const r = w / h, list = [['9:16', 9 / 16], ['4:5', .8], ['1:1', 1], ['16:9', 16 / 9], ['3:4', .75], ['4:3', 4 / 3]];
  const hit = list.find(([, v]) => Math.abs(v - r) < .02); return hit ? hit[0] : `${w}×${h}`; };
function ago(ms) {
  const d = (Date.now() - ms) / 1000;
  if (d < 60) return 'только что'; if (d < 3600) return Math.floor(d / 60) + ' мин назад';
  const dt = new Date(ms), now = new Date(), hm = dt.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
  if (dt.toDateString() === now.toDateString()) return 'сегодня, ' + hm;
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (dt.toDateString() === y.toDateString()) return 'вчера, ' + hm;
  return dt.toLocaleDateString('ru', { day: 'numeric', month: 'short' }) + ', ' + hm;
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2400); }

// ───── шапка ─────
function seg(el, items, cur, on) {
  el.innerHTML = (items instanceof Map ? [...items] : Object.entries(items)).map(([k, v]) => `<button data-k="${k}" class="${k === cur ? 'on' : ''}">${esc(v.name ?? v)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (b) on(b.dataset.k); };
}
function renderHeader() {
  seg($('#devSeg'), DEVICES, st.dev, k => { st.dev = k; store.set('dev', k); renderHeader(); renderStage(); });
  seg($('#ovSeg'), PLATFORMS, st.plat, k => { st.plat = k; store.set('plat', k); renderHeader(); renderStage(); });
  seg($('#spdSeg'), new Map(SPEEDS.map(s => ['x' + s, s + '×'])), 'x' + st.speed, k => { st.speed = +k.slice(1); video.playbackRate = st.speed; renderHeader(); });
  $('#tGuide').classList.toggle('on', st.guide);
  $('#tFill').classList.toggle('on', st.fill);
  $('#bLoop').classList.toggle('on', st.loop);
  $('#bMute').innerHTML = st.muted
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  video.muted = st.muted; video.loop = st.loop;
}
$('#tGuide').onclick = () => { st.guide = !st.guide; store.set('guide', st.guide); renderHeader(); renderStage(); };
$('#tFill').onclick = () => { st.fill = !st.fill; store.set('fill', st.fill); renderHeader(); renderStage(); };
$('#bLoop').onclick = () => { st.loop = !st.loop; store.set('loop', st.loop); renderHeader(); };
$('#bMute').onclick = () => { st.muted = !st.muted; store.set('muted', st.muted); renderHeader(); };

// ───── список видео ─────
function renderList() {
  const q = st.q.trim().toLowerCase();
  const vs = st.videos.filter(v => !q || (v.name + ' ' + v.folder).toLowerCase().includes(q));
  $('#vCount').textContent = st.videos.length || '';
  if (!st.videos.length) {
    $('#vList').innerHTML = `<div class="empty">Пока пусто. Отрендерите сцену справа или положите видео в папку <code>exports/</code>, подпапки тоже читаются. Список обновляется сам.</div>`;
    return;
  }
  const groups = {};
  for (const v of vs) (groups[v.folder] ||= []).push(v);
  const keys = Object.keys(groups).sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b));   // корень exports/ первым
  $('#vList').innerHTML = keys.map(f => (f ? `<div class="fold">${esc(f)}</div>` : '') + groups[f].map(v => {
    const isNew = !st.seen.has(v.path + ':' + v.mtime) && Date.now() - v.mtime < 6 * 3600e3;
    const wide = v.w >= v.h;
    return `<button class="vi ${v.path === st.sel ? 'on' : ''}" data-p="${esc(v.path)}">
      <div class="th ${wide ? 'wide' : ''}" style="background-image:url('/thumb/${encodeURI(v.path)}?m=${v.mtime}')"><b>${fmtDur(v.duration)}</b></div>
      <div class="vm"><div class="t">${esc(v.name)}</div>
        <div class="s"><span class="badge">${ratio(v.w, v.h)}</span>${isNew ? '<span class="badge new">новое</span>' : ''}<span>${v.w}×${v.h} · ${fmtSize(v.size)}</span></div>
        <div class="d">${ago(v.mtime)}</div></div></button>`;
  }).join('')).join('') || `<div class="empty">Ничего не нашлось.</div>`;
}
$('#vList').onclick = e => { const b = e.target.closest('.vi'); if (b) select(b.dataset.p, true); };
$('#q').oninput = e => { st.q = e.target.value; renderList(); };

function cur() { return st.videos.find(v => v.path === st.sel); }

    video.dataset.src = src; video.dataset.path = v.path; video.src = src;

function renderStage() {
  const fit = $('#fit'), v = cur();
  if (!v) { fit.innerHTML = ''; $('#stagebox').querySelector('.nothing')?.remove();

  $('#stagebox').querySelector('.nothing')?.remove();
  const D = DEVICES[st.dev], P = PLATFORMS[st.plat];
  let html, W, H, sw, sh;
  if (st.dev === 'raw') {
    sw = v.w; sh = v.h; W = sw; H = sh;
    html = `<div class="device raw" style="width:${W}px;height:${H}px"><div class="screen" style="left:0;top:0;width:${sw}px;height:${sh}px"><div class="area" id="area" style="height:${sh}px"></div></div></div>`;
  } else {
    sw = D.w; sh = D.h; const [bx, by] = D.bz; W = sw + 2 * bx; H = sh + 2 * by;
    const cut = D.cut === 'island' ? `<div class="island" style="top:11px;width:124px;height:36px"></div>`
              : D.cut === 'punch' ? `<div class="punch" style="top:14px;width:22px;height:22px"></div>` : '';
    const nav = P.nav ? P.nav + (D.home ? 34 : 0) : 0;
    html = `<div class="device" style="width:${W}px;height:${H}px;border-radius:${D.r ? D.r + bx : 52}px">
      ${D.cut === 'home' ? `<div class="homebtn" style="bottom:${(by - 54) / 2}px;width:54px;height:54px"></div>` : ''}
      <div class="screen" style="left:${bx}px;top:${by}px;width:${sw}px;height:${sh}px;border-radius:${D.r}px">
        <div class="area" id="area" style="height:${sh - nav}px"></div>
        ${statusBar(D)}${cut}${overlay(st.plat, D, sw, sh, nav)}${D.home ? '<div class="homeind"></div>' : ''}
      </div></div>`;

  layoutVideo(v, area, sw, area.clientHeight);

}
// видео в области экрана: обрезать по бокам (как лента) или вписать целиком
function layoutVideo(v, area, aw, ah) {
  const vert = v.h > v.w, cover = st.dev !== 'raw' && st.fill && vert;
  const s = cover ? Math.max(aw / v.w, ah / v.h) : Math.min(aw / v.w, ah / v.h);
  const w = v.w * s, h = v.h * s, x = (aw - w) / 2, y = (ah - h) / 2;
  Object.assign(video.style, { width: v.w + 'px', height: v.h + 'px', transform: `translate(${x}px,${y}px) scale(${s})` });
  area.querySelectorAll('.guide').forEach(e => e.remove());
  const P = PLATFORMS[st.plat];
  if (st.guide && P.safe) {
    const k = v.w / 1080, g = P.safe;               // безопасная зона в пикселях кадра 1080×1920
    const box = document.createElement('div'); box.className = 'guide';
    Object.assign(box.style, { left: x + g.l * k * s + 'px', top: y + g.t * k * s + 'px',
      width: (v.w - (g.l + g.r) * k) * s + 'px', height: (v.h - (g.t + g.b) * k) * s + 'px' });
    box.innerHTML = `<span>безопасная зона ${P.name}</span>`;
    area.appendChild(box);
  }
  st.crop = cover ? Math.round(Math.max(0, (w - aw) / s / 2)) : 0;    // сколько пикселей кадра срезано с каждой стороны
}
function fitStage(W, H) {
  const box = $('#stagebox'), pad = 36;
  const k = Math.min((box.clientWidth - pad * 2) / W, (box.clientHeight - pad * 2) / H, st.dev === 'raw' ? 1 : 1.25);
  $('#fit').style.transform = `translate(-50%,-50%) scale(${k})`;
  $('#fit').style.width = W + 'px'; $('#fit').style.height = H + 'px';
}

const PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';

const fps = () => cur()?.fps || 30;
function tick() {

  $('#time').innerHTML = `<b>${fmtT(t)}</b> / ${fmtT(d)} <span style="color:var(--tx3)">· кадр ${Math.round(t * fps())}</span>`;
  const p = d ? t / d * 100 : 0;
  $('#bf').style.width = p + '%'; $('#kn').style.left = p + '%';
  $('#bPlay').innerHTML = video.paused ? PLAY : PAUSE;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
const toggle = () => { if (!cur()) return; video.paused ? video.play().catch(() => {}) : video.pause(); };
const step = dt => { video.pause(); video.currentTime = Math.max(0, Math.min((video.duration || 0) - .001, video.currentTime + dt)); };
$('#bPlay').onclick = toggle;
$('#bPrevF').onclick = () => step(-1 / fps());
$('#bNextF').onclick = () => step(1 / fps());
video.addEventListener('click', toggle);
(() => {
  const sc = $('#scrub'); let drag = false, was;
  const at = e => { const r = sc.getBoundingClientRect(); video.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (video.duration || 0); };
  sc.onpointerdown = e => { drag = true; was = !video.paused; video.pause(); sc.setPointerCapture(e.pointerId); at(e); };
  sc.onpointermove = e => drag && at(e);
  sc.onpointerup = () => { drag = false; if (was) video.play().catch(() => {}); };
})();

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
  const vs = [...document.querySelectorAll('.vi')].map(b => b.dataset.p), i = vs.indexOf(st.sel);
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(e.shiftKey ? -1 : -1 / fps()); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); step(e.shiftKey ? 1 : 1 / fps()); }
  else if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); select(vs[i - 1], true); }
  else if (e.key === 'ArrowDown' && i < vs.length - 1) { e.preventDefault(); select(vs[i + 1], true); }
  else if (/^[1-5]$/.test(e.key)) { st.dev = Object.keys(DEVICES)[+e.key - 1]; store.set('dev', st.dev); renderHeader(); renderStage(); }
  else if (e.code === 'KeyM') $('#bMute').click();
  else if (e.code === 'KeyL') $('#bLoop').click();
  else if (e.code === 'KeyG') $('#tGuide').click();
  else if (e.code === 'KeyF') $('#tFill').click();
  else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});

  $('#sList').innerHTML = st.scenes.map(s => {
    const running = q.current?.scene === s.file, waiting = q.waiting.includes(s.file);
    const status = running ? `<span class="st old">Рендер ${q.current.pct}%</span>` : waiting ? '<span class="st no">В очереди</span>'

  let d;
  try { const r = await fetch('/api/library'); if (!r.ok) throw 0; d = await r.json(); }
  catch (e) { $('#offline').style.display = 'grid'; return; }
  apply(d);
  const es = new EventSource('/api/events');
  es.addEventListener('library', e => apply(JSON.parse(e.data)));
  es.addEventListener('queue', e => { st.queue = JSON.parse(e.data); renderScenes(); });
  es.addEventListener('rendered', e => { const r = JSON.parse(e.data); toast(r.ok ? `Готово: ${r.scene.replace('.html', '')}` : `Ошибка рендера: ${r.scene}`); if (!r.ok) console.error(r.log); });
  setInterval(renderList, 60e3);                        // «5 мин назад» обновляется
})();
</script>
</body>
</html>
