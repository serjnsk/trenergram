<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>12 · Авторасчёт весов</title>
<link rel="stylesheet" href="engine.css">
<script src="engine.js"></script>
</head>
<body>
<script>
// Сценарий: ../scripts/12-weights.md (серия «Фичи с лендинга», вариант «схема»)
// Экран schema/12-weights.html: становая 3 × 3 · 80 % для группы, веса от 1ПМ с округлением до 2,5 кг.
const S = Scene({ format: '9:16', duration: 15 });
S.phone('schema/12-weights.html');

S.caption(.2, 7.0, 'Проценты —\n*в килограммы*', { sub: 'Нагрузка от 1ПМ, 3ПМ или рекорда' });

S.spot(1.0, 3.6, '#scheme', { label: 'Схема и *процент*' });
S.type(1.3, 3.0, '#tx', '3 × 3 · 80 %');

S.spot(3.7, 4.5, '#calc', { pad: 6 });
S.tap(4.2, '#calc');

S.spot(4.7, 7.0, '#tbl', { label: 'Свой вес — *до 2,5 кг*', dy: -250 });

S.caption(7.2, 12.3, 'Новый рекорд —\n*веса пересчитаны*', { sub: 'Клиент видит только килограммы' });

S.cue(7.4, (d, w) => w.ST.record());
S.spot(7.7, 9.2, '#toast', { label: 'Олег поставил *рекорд*' });

S.cue(9.3, (d, w) => w.ST.recalc());
S.spot(9.5, 12.2, '#r3', { label: '135 → *145 кг* само' });

S.outro(12.4);
S.start();
</script>
</body>
</html>
