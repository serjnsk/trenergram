<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Схема · Ввод текстом и AI</title>
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
/* Ролик 14 «Ввод текстом и AI». Состояния: sheet → parse → done. */
.who{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:#fff;border:2px solid var(--acc-p)}
.who b{font-size:16px;color:var(--acc)} .who small{display:block;font:600 12.5px Inter;color:var(--tx2);margin-top:2px}
.day .hd{justify-content:space-between}
.day .hd small{font:600 13px Inter;color:var(--tx2)}
.body{padding:14px;position:relative;min-height:470px}
.empty{display:flex;flex-direction:column;gap:12px}
.ph{height:92px;border-radius:16px;border:2px dashed var(--g2);display:flex;align-items:center;gap:12px;padding:0 18px}
#btn{height:58px;border-radius:16px;border:2px solid var(--g2);background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font:700 19px Inter}
#btn i{width:20px;height:14px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);position:relative}
#btn i:after{content:"";position:absolute;left:0;right:5px;top:3.5px;height:3px;background:var(--ink)}
#note{position:absolute;left:14px;right:14px;top:14px;border-radius:18px;border:2.5px solid var(--acc);background:#fff;padding:16px 18px 20px}
#note .nh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#tx{font:600 20px/1.55 Inter;white-space:pre-line;min-height:186px}
#tx:after{content:"";display:inline-block;width:2.5px;height:22px;margin-left:2px;vertical-align:-4px;background:var(--acc)}
#ai{margin-left:auto;height:42px;padding:0 16px;border-radius:21px;display:flex;align-items:center;gap:7px;font:800 17px Inter;
  border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(#3FD3E6,#6A8BFF,#B37BFF,#FF6FA8,#FF9F43,#F7D54A,#8FE36B,#3FD3E6) border-box}
#ai b{color:var(--acc);font-size:18px}
#res{position:absolute;left:14px;right:14px;top:14px;display:flex;flex-direction:column;gap:12px}
#prop{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--acc-a);border:2px solid var(--acc-p);
  transition:opacity .3s,transform .3s,height .35s,padding .35s,margin .35s}
#prop .pt{font:800 14px Inter;color:var(--acc);letter-spacing:.04em;text-transform:uppercase}
#prop .btn{margin-left:auto;height:42px}
.blk{transition:opacity .35s,transform .35s,border-color .3s}
.blk .hd{background:var(--g1);font-size:18px}
.blk .hd .chip{margin-left:auto}
.blk .row{transition:opacity .3s,transform .3s}
.foot{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;border-top:1.5px solid var(--g1)}
.foot .sw{width:44px;height:26px;border-radius:13px;background:var(--g2)}
.foot .btn{margin-left:auto;height:44px}

/* состояния */
#note,#prop,.blk,.blk .row{opacity:0}
#note{transform:translateY(16px) scale(.98);transition:opacity .35s,transform .35s}
#prop{transform:translateY(-10px)} .blk{transform:translateY(18px)} .blk .row{transform:translateX(-12px)}
.empty{transition:opacity .3s,transform .3s}
.s-sheet .empty,.s-parse .empty,.s-done .empty{opacity:0;transform:translateY(-10px)}
.s-sheet #note{opacity:1;transform:none}
.s-parse #note,.s-done #note{opacity:0;transform:scale(.96)}
.s-parse #prop{opacity:1;transform:none}
.s-done #prop{opacity:0;height:0;padding-top:0;padding-bottom:0;margin-bottom:-12px;border-width:0}
.s-parse .blk,.s-done .blk,.s-parse .blk .row,.s-done .blk .row{opacity:1;transform:none}
.s-done .blk{border-color:var(--acc-p)}
#b2{transition-delay:.12s}
.blk .row:nth-child(3){transition-delay:.15s}.blk .row:nth-child(4){transition-delay:.25s}
</style>
</head>
<body>
<main class="main">
  <div class="who"><i class="av">ИП</i><div><b>Иван Петров</b><small>1ПМ присед 190 кг · жим 120 кг</small></div></div>
  <div class="card day">
    <div class="hd">Вторник, 14 октября<small>черновик</small></div>
    <div class="body">
      <div class="empty">
        <div class="ph"><i class="bar" style="width:60px"></i><i class="bar s" style="width:150px"></i></div>
        <div id="btn"><i></i>Блок текстом</div>
      </div>
      <div id="note">
        <div class="nh"><i class="bar" style="width:70px;height:14px"></i><div id="ai"><b>✦</b>AI</div></div>
        <div id="tx"></div>
      </div>
      <div id="res">
        <div id="prop"><span class="pt">✦ Разобрано ИИ</span><span class="btn" id="yes">Принять</span></div>
        <div class="card blk" id="b1"><div class="hd">Разминка<span class="chip">Разминка</span></div>
          <div class="row"><span>Бег</span><b class="chip">5 мин</b></div></div>
        <div class="card blk" id="b2"><div class="hd">Силовая<span class="chip">Силовая</span></div>
          <div class="row"><span>Присед со штангой</span><b class="chip">5×5</b><b class="chip">80 кг</b></div>
          <div class="row"><span>Жим лёжа</span><b class="chip">4×8</b><b class="chip">60 кг</b></div>
          <div class="row"><span>Планка</span><b class="chip">3×45 с</b></div></div>
      </div>
    </div>
  </div>
</main>
<script>
Kit.trainer({ title: 'Конструктор', foot: '<div class="foot"><i class="sw"></i><i class="bar" style="width:90px"></i><span class="btn">Сохранить</span></div>' });
window.ST = { sheet: () => Kit.state('sheet'), parse: () => Kit.state('parse'), accept: () => Kit.state('done') };
document.getElementById('btn').onclick = ST.sheet;
document.getElementById('ai').onclick = ST.parse;
document.getElementById('yes').onclick = ST.accept;
</script>
</body>
</html>
