<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конструктор · Тренерграм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@900&family=Archivo:wdth,wght@62..125,400..700&family=Onest:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Структура одна на все стилистики, тема подключается следом и меняет
     только цвет и типографику. Поведение живёт в общем скрипте. -->
<link rel="stylesheet" href="assets/base-trainer.css">
<link rel="stylesheet" href="assets/theme-01-strava.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page">
      <div class="cons">
        <main>
          <section class="wk" id="wk"></section>
          <section class="doc" id="doc"></section>
        </main>
        <aside class="rail">
          <button class="railtog" id="railtog" title="Свернуть панель" aria-label="Свернуть панель"></button>
          <div class="railhead">
            <div class="railttl">Библиотеки</div>
            <div class="tabs" id="tabs">
              <button data-tab="ex" class="on">Упражнения</button>
              <button data-tab="blk">Блоки</button>
            </div>
            <label class="search">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
              <input id="q" placeholder="Поиск…" autocomplete="off">
            </label>
          </div>
          <div class="railbody" id="src"></div>
          <div class="railfoot" id="railfoot"></div>
        </aside>
      </div>
    </div>
  </div>
</div>

<div class="ov" id="ov"></div>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/trainer.js"></script>
<pre id="T" style="position:fixed;left:8px;bottom:8px;z-index:9999;background:#111;color:#0f0;font:11px/1.35 monospace;padding:8px;margin:0;max-width:1300px;white-space:pre-wrap"></pre><script>
const out=[]; const log=(...a)=>{out.push(a.join(' ')); document.getElementById('T').textContent=out.join('\n')};
window.addEventListener('error', e=>log('ERR', e.message, e.lineno));
addEventListener('load', ()=>{ try{ localStorage.removeItem('trenergram.state');
  const mode=new URLSearchParams(location.search).get('mode');
  log('TODAY', TODAY, 'SHIFT', SHIFT, 'NOW', NOW, '| p1.start', program('p1').start, '| range:', document.querySelector('.wkrange').textContent, '| today cell:', !!document.querySelector('.day.today'), '| heads:', [...document.querySelectorAll('.day .d')].slice(0,3).map(x=>x.textContent).join(' | '));
  if(mode==='compact'){ document.querySelector('[data-view="compact"]').click(); log('view:', STATE.laneView, '| saved:', JSON.parse(localStorage.getItem('trenergram.state')).laneView, '| compact cells:', document.querySelectorAll('.days.compact .day').length, '| sample:', [...document.querySelectorAll('.day')].slice(0,4).map(x=>x.textContent.trim().replace(/\s+/g,' ')).join(' || ')); }
  if(mode==='today'){ document.getElementById('dayNext').click(); document.getElementById('dayNext').click(); log('after 2 next: range', document.querySelector('.wkrange').textContent); document.getElementById('wkToday').click(); log('today →', S.date, '=== TODAY:', S.date===TODAY, '| range', document.querySelector('.wkrange').textContent); }
}catch(e){ log('EXC', e.message) } });</script></body>
</html>
